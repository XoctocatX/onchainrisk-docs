      summary: Fetch a saved multi-chain report by id
      description: |
        Retrieve one saved multi-chain wallet report owned by the calling API
        key. Does NOT consume quota.

        `id` accepts the UUID `reportPublicId` returned by
        `POST /api/v1/multichain/scan` (preferred), or the legacy integer
        report id. Returns 404 if the report does not exist or is not owned by
        the caller.
      security:
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Report id — UUID reportPublicId (preferred) or legacy integer id.
          schema: { type: string }
      responses:
        '200':
          description: Saved multi-chain report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultichainReportResponse'
        '401':
          description: Unauthorized
        '404':
          description: Report not found or not owned by the caller

  # ── MEV ───────────────────────────────────────────────
  /api/investigations/{id}:
    get:
      tags: [AI Investigation]
      summary: Get investigation detail
      security:
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Full investigation with messages and tool calls
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationResponse'
        '404': { description: Not found }

    delete:
      tags: [AI Investigation]
      summary: Archive investigation
      description: >-
        Soft-delete. Hides the investigation from the default list but preserves its data.
        #729: previously published as `POST /api/investigations/{id}/archive`, which has no
        runtime route. Archiving has always been DELETE on the resource — the shape the
        dashboard calls.
      security:
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationArchivedResponse'
        '404': { description: Not found }

# ── Outbound webhook callbacks ──────────────────────────────────────────────
# OpenAPI 3.1 top-level `webhooks:` describes callbacks OnChainRisk sends
# OUT to customer-configured endpoints (registered via PATCH
# /api/notifications/settings). See docs/integration/webhooks.md for HMAC
# verification and delivery semantics (single-attempt today, ~5-min cadence).
webhooks:
  watchlistAlert:
    post:
      operationId: watchlistAlertWebhook
      # Outbound webhook — auth is HMAC SHA-256 (X-Signature-256), not the
      # apiKeyAuth scheme used by inbound endpoints. Empty list explicitly
      # opts out of root-level apiKeyAuth so codegen / lint don't expect it.
      security: []
      summary: Watchlist alert (outbound webhook)
      description: |
        Delivered to your configured `webhook_url` when a watchlist item
        sees a new on-chain transaction. Cron cadence ~5 minutes.

        **HMAC**: when `webhook_secret` is set, the `X-Signature-256` header
        contains `sha256=<hex>` over the raw request body bytes. Verify
        before processing — see docs/integration/webhooks.md for sample
        Node and Python verifiers.

        **Delivery semantics**: single attempt per alert today. If your
        endpoint is briefly unavailable the alert is logged on our side
        and not retried. Retries are roadmap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchlistAlertWebhookPayload'
      parameters:
        - in: header
          name: X-Signature-256
          required: false
          description: |
            HMAC SHA-256 of the raw request body, hex-encoded, prefixed
            with `sha256=`. Present only when `webhook_secret` was set
            via PATCH /api/notifications/settings. Strongly recommended
            to configure.
          schema:
            type: string
            example: "sha256=<hex_hmac_sha256_signature>"
      responses:
        '2xx':
          description: |
            Any 2xx response acknowledges receipt. We do not retry on
            non-2xx today (single-attempt delivery).

components:
  securitySchemes:
    apiKeyAuth:
      type: http
      scheme: bearer
      description: API key (create at https://app.onchainrisk.io/dashboard/api-keys)

  responses:
    Unauthorized:
      description: |
        Missing or invalid API key. `requireAuth` returns `unauthorized(...)` =
        `utils/response.js::error(message, 401, 'UNAUTHORIZED')`, so the body is
        ALWAYS the standard envelope with an OBJECT `error` — it is never bodiless
        and never a bare string.
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              error: { $ref: '#/components/schemas/GenericError' }
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Authentication required

    RateLimited:
      description: |
        Rate limit or quota exhausted. The body is the standard envelope with an
        OBJECT `error`: `utils/response.js::error(...)` for a plan/credit rejection
        (`code` e.g. `NO_CREDITS`, `PLAN_LIMIT_REACHED`) and `rateLimited(...)` for
        the per-IP/per-key limiter (`code: RATE_LIMITED`, plus `X-RateLimit-*`
        headers). This status is never bodiless.
      headers:
        X-RateLimit-Limit:
          schema: { type: integer }
          description: Sent by the request limiter branch (`rateLimited`), not by quota rejections.
        X-RateLimit-Remaining:
          schema: { type: integer }
        X-RateLimit-Reset:
          schema: { type: string, format: date-time }
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              error: { $ref: '#/components/schemas/GenericError' }
          example:
            success: false
            error:
              code: RATE_LIMITED
              message: Rate limit exceeded

    ValidationFailed:
      description: |
        Address failed validation before any scan was performed. HTTP status
        is **422** with envelope `{ success: false, error: ErrorResponse }`.
        `error.details.errorCode` carries the granular reason.
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              error: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            address-network-mismatch:
              summary: Tron address submitted with network=eth
              value:
                success: false
                error:
                  message: "Validation failed"
                  code: "VALIDATION_ERROR"
                  details:
                    address: "Address format does not match selected network. The address looks like a tron address, but network was set to eth."
                    errorCode: "ADDRESS_NETWORK_MISMATCH"
                    detectedFamily: "tron"
                    requestedNetwork: "eth"
            invalid-address:
              summary: Whitespace-only address
              value:
                success: false
                error:
                  message: "Validation failed"
                  code: "VALIDATION_ERROR"
                  details:
                    address: "Address is required."
                    errorCode: "INVALID_ADDRESS"
            unsupported-network:
              summary: network=Ethereum (not in whitelist)
              value:
                success: false
                error:
                  message: "Validation failed"
                  code: "VALIDATION_ERROR"
                  details:
                    address: "Unsupported network 'ethereum'. Supported: arbitrum, avalanche, base, bsc, btc, cardano, celo, cosmos, cronos, eth, fantom, linea, ltc, moonbeam, optimism, polygon, polygon_zkevm, scroll, sol, ton, tron, xrp, zksync."
                    errorCode: "UNSUPPORTED_NETWORK"
                    requestedNetwork: "ethereum"
            deep-analysis-unsupported-network:
              summary: Deep analysis (peel chain) not available for this network
              value:
                success: false
                error:
                  message: "Validation failed"
                  code: "VALIDATION_ERROR"
                  details:
                    network: "Deep analysis not yet supported for TRON. Supported: ETH, Arbitrum, Optimism, Base, Polygon, Avalanche, Linea, zkSync Era, Scroll."
                    errorCode: "DEEP_ANALYSIS_UNSUPPORTED_NETWORK"
                    requestedNetwork: "tron"
            could-not-detect-network:
              summary: Unrecognisable address, no network hint
              value:
                success: false
                error:
                  message: "Validation failed"
                  code: "VALIDATION_ERROR"
                  details:
                    address: "Could not detect network from address format. Please specify the network parameter."
                    errorCode: "COULD_NOT_DETECT_NETWORK"
            invalid-address-checksum:
              summary: Tron-shaped string with bad Base58Check
              value:
                success: false
                error:
                  message: "Validation failed"
                  code: "VALIDATION_ERROR"
                  details:
                    address: "Address failed tron checksum validation."
                    errorCode: "INVALID_ADDRESS_CHECKSUM"
                    detectedFamily: "tron"
                    requestedNetwork: "tron"

  schemas:
    Coverage:
      type: object
      description: |
        Per-chain coverage disclosure block. Present on every report response
        regardless of stage — clients should NEVER need to special-case its absence.

        Stage taxonomy:
          - `ga`       — General Availability: full historical depth within stated window.
          - `rollout`  — Active migration / soak window. Coverage windows may temporarily vary.
          - `preview`  — Pre-v1: reports may have incomplete depth or gaps.
          - `degraded` — Known operational incident; see `warning` and `incident_url`.

        **Client integration requirement:** clients integrating OnChainRisk are
        REQUIRED to surface the `coverage.disclosure` field to end users when
        `stage != ga`. For `stage in [preview, degraded]`, clients MUST surface
        the `warning` field prominently.

        Canonical per-chain status matrix: see the `matrix_url` link.
      required: [stage, window, data_path, as_of, disclosure, matrix_url]
      properties:
        stage:
          type: string
          enum: [ga, rollout, preview, degraded]
          description: |
            Coverage maturity for this chain.
        window:
          type: [string, 'null']
          example: "30d"
          description: |
            Trailing coverage window (e.g. "30d", "90d"). May be `null` for
            chains in `preview` stage where no window is yet committed.
        data_path:
          type: string
          example: "self_hosted_nitro_clickhouse"
          description: |
            Production data path label (informational; not a user-facing
            commitment). Subject to change without notice within the stated stage.
        as_of:
          type: string
          format: date
          example: "2026-05-04"
          description: ISO date when this coverage status was last verified.
        disclosure:
          type: string
          description: |
            Disclosure text appropriate for this stage. Clients SHOULD surface
            this to end users when `stage != ga`. For `ga` chains, this is the
            standard methodology footer reference.
        warning:
          type: string
          description: |
            Strong warning text. Present (REQUIRED) when `stage in [preview, degraded]`.
            Clients MUST surface this prominently. Absent for `stage in [ga, rollout]`.
        incident_url:
          type: string
          format: uri
          description: |
            Incident status URL. May be present when `stage = degraded`.
        matrix_url:
          type: string
          format: uri
          example: "https://onchainrisk.io/coverage"
          description: |
            Public canonical coverage matrix page. UI pills and clients
            integrating OnChainRisk should link here for current per-chain status.
        served_from:
          type: string
          enum: [hot, archive, direct_node, direct_api, mixed]
          description: |
            Optional hybrid read-model disclosure. Which read path served this
            report: `hot` (own indexer / hot store), `archive` (replayed from
            archive), `direct_node` (point node lookup), `direct_api`
            (third-party API fallback, e.g. Moralis), or `mixed` (hot/indexer
            data combined with a point lookup such as `eth_getCode` is_contract).
            Absent when the producer does not yet emit hybrid disclosure.
        historical_completeness:
          type: string
          enum: [within_window, replayed_from_archive, partial_via_fallback, unknown_before_window]
          description: |
            Optional hybrid read-model disclosure. Depth completeness of the
            served data: `within_window` (full depth within the stated window),
            `replayed_from_archive` (archive replay restored depth),
            `partial_via_fallback` (a third-party fallback supplied partial
            depth), or `unknown_before_window` (the indexer window limited how
            far back depth is known). Absent when not emitted by the producer.
        fallback_used:
          type: boolean
          description: |
            Optional hybrid read-model disclosure. `true` when a third-party /
            direct-API fallback (e.g. Moralis) supplied the analytical data.
            A point lookup such as `eth_getCode` / is_contract alone does NOT
            set this. Absent when not emitted by the producer.
        source_mode:
          type: string
          description: |
            Optional hybrid read-model disclosure. Free-form source label, e.g.
            `mixed` (hot indexer + point lookup), `hot:<data_path>`, or
            `fallback:moralis`. Informational; not an enum. Absent when not
            emitted by the producer.
        coverage_window:
          type: [string, 'null']
          example: "30d"
          description: |
            Optional alias of `window` — same value, provided for hybrid
            read-model consumers that key on `coverage_window`. Does NOT change
            the meaning of `window`. Absent when not emitted by the producer.
      example:
        stage: rollout
        window: "30d"
        data_path: self_hosted_nitro_clickhouse
        as_of: "2026-05-04"
        disclosure: "OnChainRisk's multi-chain coverage is in active rollout..."
        matrix_url: https://onchainrisk.io/coverage
        served_from: hot
        historical_completeness: within_window
        fallback_used: false
        source_mode: "hot:self_hosted_nitro_clickhouse"
        coverage_window: "30d"

    GraphNode:
      type: object
      description: |
        Counterparty node in the paid graph response. One node per
        unique counterparty address aggregated from the target's
        transaction history.
      required: [address, txCount]
      properties:
        address:
          type: string
          description: Counterparty address (case preserved per network — hex addresses returned in lowercase).
        label:
          type: [string, 'null']
          description: |
            Human-readable label from the OnChainRisk label database
            (exchange names, mixer/bridge tags, custom user labels, etc.)
            or `null` when no label matches.
        isTarget:
          type: boolean
          description: |
            Always `false` for counterparty nodes returned by this
            endpoint. Reserved for graph-rendering clients that may
            also represent the queried address as a node — the API
            does not currently emit a target node, but client code
            should treat unknown values defensively.
        totalValue:
          type: string
          description: |
            Aggregate native value across all transactions with this
            counterparty, formatted with the network's native unit
            (e.g. `"1.5 ETH"`, `"42 BNB"`, `"100 TRX"`). String to
            preserve precision across networks.
        txCount:
          type: integer
          minimum: 0
          description: Total transactions between target and this counterparty in the fetched history.
        tokens:
          type: array
          description: |
            Token symbols flowing through this counterparty (capped at
            the top-N by volume per the analyzer). May be empty when
            no token transfers were observed or the network has no
            token analyzer wired.
          items:
            type: string

    GraphEdge:
      type: object
      description: |
        Aggregated edge between target and one counterparty. Each
        `(target, counterparty)` pair produces exactly one edge —
        all transactions in the same direction-dominant flow are
        summed. Direction is inferred: edge points from the side
        that contributed more native value.
      required: [from, to, value, valueWei, txCount]
      properties:
        from:
          type: string
          description: Source address (target or counterparty depending on net flow direction).
        to:
          type: string
          description: Destination address.
        fromLabel:
          type: [string, 'null']
          description: Label of the `from` address (counterparty label when the counterparty was the sender; otherwise `null`).
        toLabel:
          type: [string, 'null']
          description: Label of the `to` address (counterparty label when the counterparty was the recipient; otherwise `null`).
        value:
          type: string
          description: Native value formatted with unit (e.g. `"1.5 ETH"`).
        valueWei:
          type: string
          description: |
            Native value in raw integer units (wei for EVM, sun for
            Tron, satoshi for BTC/LTC, lamports for SOL, etc.). String
            to preserve precision beyond JS Number range.
        txCount:
          type: integer
          minimum: 1
          description: Number of transactions aggregated into this edge.
        firstTx:
          type: integer
          description: |
            Unix timestamp (seconds) of the earliest transaction
            aggregated into this edge. May be `0` when the upstream
            analyzer was unable to determine — treat `0` as "unknown",
            not "epoch zero".
        lastTx:
          type: integer
          description: |
            Unix timestamp (seconds) of the latest transaction
            aggregated into this edge. Same `0`-as-unknown caveat as
            `firstTx`.
        tokenBreakdown:
          type: array
          description: |
            Per-token volume context for transactions on this edge.
            Common fields per item include `symbol` (string), `value`
            (string, formatted), and `txCount` (integer); additional
            per-network fields may be present. **Treat the item shape
            as open** — clients should defensively handle unknown
            properties and not assume a closed schema.
          items:
            type: object

    WatchlistAlertWebhookPayload:
      type: object
      description: |
        Body sent to a customer-configured webhook URL when a watchlist
        item sees a new transaction. Stable top-level fields are listed
        below; nested `data.*` fields evolve and clients should parse
        defensively (do not assume the shape is closed).
      required:
        - type
        - alert_id
        - address
        - network
      properties:
        type:
          type: string
          enum: [watchlist_alert]
          description: Webhook event type. Currently only `watchlist_alert`.
        alert_id:
          type: integer
          description: Stable per-alert ID; usable as idempotency key.
        watchlist_id:
          type: integer
          description: ID of the watchlist item that fired this alert.
        address:
          type: string
          description: The watched address.
        network:
          type: string
          description: Network identifier (e.g. `eth`, `bsc`, `tron`).
        alert_type:
          type: [string, 'null']
          description: |
            High-level alert category. Examples seen in production:
            `incoming`, `outgoing`, `balance_change`. Treat as
            open-ended — new types may be added without spec bump.
        tx_hash:
          type: [string, 'null']
          description: Transaction hash (when applicable).
        explorer_url:
          type: [string, 'null']
          format: uri
          description: Pre-built explorer link for the transaction.
        value:
          type: [string, 'null']
          description: Native value, formatted as a string for precision.
        timestamp:
          type: [integer, 'null']
          description: Unix seconds when the alert was emitted.
        data:
          type: object
          description: |
            Nested context object — fields evolve. Currently includes
            denormalized copies of `tx_hash`, `explorer_url`, `network`,
            `address`, plus a `tx` sub-object for transaction details
            and `alertType`. Parse defensively.
      example:
        type: watchlist_alert
        alert_id: 12345
        watchlist_id: 678
        address: "0xYourAddress"
        network: eth
        alert_type: incoming
        tx_hash: "0xabc123..."
        explorer_url: "https://etherscan.io/tx/0xabc123..."
        value: "1.234"
        timestamp: 1777800000
        data:
          address: "0xYourAddress"
          network: eth
          alertType: incoming
          tx:
            hash: "0xabc123..."
            value: "1.234"
            from: "0xSender..."
            to: "0xYourAddress"
          tx_hash: "0xabc123..."
          explorer_url: "https://etherscan.io/tx/0xabc123..."

    ReportAccess:
      type: object
      description: |
        Customer-facing READ-access DTO for the analysis artifact
        (`utils/report-egress-access.js::buildAccessDTO`). Egress metadata only — it is
        never persisted into the report and never appears inside the preview projection.

        `state` says what the caller is entitled to SEE:
          - `FULL`               — monetization inactive / grandfathered, or a request-time
                                   full-capability override. Not purchasable.
          - `PERMANENT_OWNED`    — a durable unlock exists for this artifact.
          - `SUBSCRIPTION_FULL`  — full access for the life of the current subscription.
          - `PREVIEW`            — no entitlement; the body is the preview projection.

        `temporarilyUnavailable: true` marks a FAIL-CLOSED preview (an entitlement or
        subscription lookup error), which is NOT the same as a genuine no-entitlement
        preview: the former is never purchasable.
      required: [state, unlockable]
      properties:
        state:
          type: string
          enum: [FULL, PERMANENT_OWNED, SUBSCRIPTION_FULL, PREVIEW]
        unlockable:
          type: boolean
          description: |
            `true` only for a genuine no-entitlement PREVIEW over a persisted, deliverable
            artifact. An unpersisted fresh re-scan is never unlockable — there is no durable
            row for `POST /api/billing/artifact-unlock` to target.
        temporarilyUnavailable:
          type: boolean
          description: Present and `true` only on a fail-closed preview.
        unlockBasePriceDisplay:
          type: string
          description: |
            Presentation-only base price, present only when `unlockable` is `true`.
            Settlement is by invoice; never treat this as the charged amount.
        unlockCurrency:
          type: string
          enum: [USDT]
          description: Present only when `unlockBasePriceDisplay` is.

    ReportExport:
      type: object
      description: |
        EXPORT capability for this artifact (`utils/export-authority.js::buildExportDTO`) — a
        separate capability from read access, clamped upstream so the two can never contradict
        each other within one response (a PREVIEW read never reports full export).
      required: [full]
      properties:
        full:
          type: boolean
          description: Whether the caller may export the full artifact.
        temporarilyUnavailable:
          type: boolean
          description: Present and `true` when the export authority could not be resolved (fail-closed).

    GenericError:
      type: object
      description: |
        The runtime's UNIVERSAL error object — what `utils/response.js::error()`
        serializes for every non-validation failure (401, 403, 404, 429, 500, 503 …):

        ```json
        { "success": false, "error": { "code": "UNAUTHORIZED", "message": "Authentication required" } }
        ```

        Deliberately has NO `code` enum: the codes are an open, growing set and
        pinning them here would publish a closed list the runtime does not honour.
        `ErrorResponse` is the narrower validation-family view of the same object
        (its `code` enum is `VALIDATION_ERROR` only) and is kept separate so the 422
        contract stays as tight as it is today.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code, e.g. `UNAUTHORIZED`, `RATE_LIMITED`, `NO_CREDITS`.
        message:
          type: string
          description: Short human-readable summary. Never carries provider or internal detail.
        details:
          type: object
          description: Optional structured context. Absent unless the failing path supplies it.

    ErrorResponse:
      type: object
      description: |
        Stable error envelope for validation and business-rule failures.
        The shape mirrors the live API response:

        ```json
        { "success": false, "error": ErrorResponse }
        ```

        Required fields (`code` + `message`) are always populated; `details`
        carries structured diagnostic context and is present on validation
        failures. Clients should treat unknown fields as additive
        (no `additionalProperties: false`).
      required: [code, message]
      properties:
        code:
          type: string
          description: Outer envelope code. Always `VALIDATION_ERROR` for the validation family.
          enum:
            - VALIDATION_ERROR
        message:
          type: string
          description: Short, stable human-readable summary.
        details:
          type: object
          description: |
            Granular context. For validation failures the shape below is stable;
            for other error classes the API may return different keys.
          properties:
            address:
              type: string
              description: Human-readable reason specific to the failing address.
            errorCode:
              type: string
              description: |
                Granular validation reason. Stable machine-readable code.

                  - `INVALID_ADDRESS` — empty, wrong format, whitespace-only.
                  - `UNSUPPORTED_NETWORK` — `network` not in the supported list.
                  - `COULD_NOT_DETECT_NETWORK` — address format unrecognised and `network` omitted.
                  - `INVALID_ADDRESS_CHECKSUM` — decode succeeded, family checksum failed (Tron / BTC-legacy / LTC-legacy). Solana decode failures surface as `INVALID_ADDRESS` because Solana is not checksum-based.
                  - `ADDRESS_NETWORK_MISMATCH` — detected family inconsistent with requested `network`.
              enum:
                - INVALID_ADDRESS
                - UNSUPPORTED_NETWORK
                - COULD_NOT_DETECT_NETWORK
                - INVALID_ADDRESS_CHECKSUM
                - ADDRESS_NETWORK_MISMATCH
            detectedFamily:
              type: [string, 'null']
              description: |
                Address family detected from the input. Null when the format
                was unrecognisable. ENS names are resolved through a legacy
                path and are intentionally not part of the strict family
                contract documented here.
            requestedNetwork:
              type: [string, 'null']
              description: Normalized network string from the request, if any.

    ExchangeDepositsValid:
      type: object
      description: >-
        Valid exchange-deposit summary. Exchange-identity -> count only;
        untrusted token symbols are never part of the breakdown keys. Legacy
        valid objects omit `status`.
      required: [totalDeposits, totalValue, exchangeBreakdown, flags]
      properties:
        totalDeposits: { type: integer, minimum: 0 }
        totalValue: { type: string }
        exchangeBreakdown:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        exchangeAssetBreakdown:
          type: array
          items: { type: object }
        flags:
          type: array
          items: { type: string }
    ExchangeDepositsInvalidated:
      type: object
      description: >-
        M2-C2 sentinel written when a persisted report's historical exchange
        attribution can no longer be truthfully reconstructed from retained
        data. Carries no totalDeposits/totalValue/exchangeBreakdown/flags — the
        prior numeric attribution must not be retained as fact. Never produced
        by live analysis.
      required: [status, curation]
      properties:
        status: { type: string, enum: [historical_attribution_invalidated] }
        curation: { type: string, minLength: 1, example: "M2-C2-2026-08-04" }
    # ── #735 Slice 1A R1 — derived from the PAID RUNTIME SERIALIZERS in web/api/main.py.
    #
    # The first version of these three was copied from openapi-sandbox.yaml on the assumption
    # that it described the same runtime objects. It does not: the sandbox definitions are
    # stale, and copying them reversed the one direction this slice exists to enforce
    # (runtime → spec). Every property below is read off the `.append({...})` call named in
    # each description, and nullability comes from the dataclasses in ethforensics/types.py.
    #
    # No `required` list: AnalysisResult declares none, and while both tx_history branches
    # emit the ten common keys unconditionally, the Worker accepts `data.transactionHistory ||
    # data.transaction_history` and so does not prove this is the only producer. Promising
    # required keys on that basis would be inventing a guarantee.
    #
    # NOTE: openapi-sandbox.yaml still carries the OLD shapes under these same names. That
    # divergence is deliberate for now — the sandbox repair is a later canonical-contract
    # compatibility fix, and no current validator forces it.
    CounterpartyLabel:
      type: object
      description: |
        R2. The PUBLIC egress shape of `counterpartyLabel`, which is an OBJECT, not a string.
        `web/api/main.py` assigns `label_db.lookup(...)` directly —
        `LabelDatabase.lookup() -> Optional[LabelEntry]` (ethforensics/labels/loader.py:1356)
        — with no `.label` extraction and no `asdict`. Unlike `topCounterparties[].label`,
        `clusters[].members[].label`, top-level `labels` and `fundedBy.label`, which the Worker
        passes through `normalizeLabel()`, `counterpartyLabel` is touched NOWHERE in the Worker:
        both the sync path (routes/check.js) and the async path (consumer.js) forward
        `transaction_history` / `token_transfer_history` verbatim. So the dataclass reaches
        paying customers as an object.

        Documented, deliberately NOT fixed. Normalising it would change an existing paid
        response type for the 2 live paid integrations, which #735's standing rule forbids —
        sandbox adapts to paid, not paid to sandbox. Slice 1 records current truth even where
        current truth is ugly; any normalisation is a separate compatibility/versioning
        decision. `/api/analyze` declares no `response_model` and no `exclude_none`, so all five
        dataclass fields serialise, including `custom_label: null`.

        No `required` list: the keys are guaranteed only by dataclass serialisation on this one
        path and nothing pins that, so adding a `response_model` or `exclude_none` upstream
        would silently break a `required` promise made here.
      properties:
        address: { type: string }
        label: { type: string }
        category: { type: string }
        source: { type: string, description: "Dataclass default is \"manual\"." }
        custom_label:
          type: [string, 'null']
          description: "`Optional[str] = None` — a preserved user note on a protected high-risk record; null for every other record. Snake_case because the dataclass field name is serialised as-is."
    Transaction:
      type: object
      description: |
        Native transaction entry. Serializer: `tx_history.append({...})` in web/api/main.py —
        two branches, a UTXO branch and the EVM/account branch, which share the first ten
        properties. The `utxo*` / `feeSats` / `balanceDeltaSats` properties are emitted ONLY
        by the UTXO branch, so they are absent on other networks rather than null.
      properties:
        hash: { type: string }
        timestamp: { type: integer, description: Unix seconds. }
        direction:
          type: string
          # EVM/account branch emits in|out. UTXO branch maps flow_kind through _dir_map:
          # OUTGOING→out, INCOMING→in, COINBASE→in, SELF→self, MIXED→mixed, defaulting to
          # mixed — so `self` and `mixed` are reachable on UTXO networks only.
          enum: [in, out, self, mixed]
        counterparty:
          type: string
          description: May be the empty string when no single counterparty is attributable (UTXO MIXED).
        counterpartyLabel:
          # 3.1 oneOf-with-null, the idiom this spec already uses for destinationEntitySummary,
          # exchangeDeposits and honeypot. R1 wrongly declared this a nullable STRING.
          oneOf:
            - $ref: '#/components/schemas/CounterpartyLabel'
            - type: 'null'
          description: "Raw `LabelEntry` object from `label_db.lookup(...)`, or null when the counterparty is unlabelled or no label DB is loaded. NOT a string — see CounterpartyLabel."
        value:
          type: [string, 'null']
          description: "Formatted amount. NULL on a UTXO row whose transfer value is not attributable (`format_value(_transfer) if _transfer is not None else None`)."
        valueWei:
          type: [string, 'null']
          description: Base-unit amount as a decimal string. Null in the same non-attributable UTXO case.
        isError: { type: boolean }
        methodId:
          type: string
          description: "`t.method_id or ''` — empty string rather than null; always '' on UTXO rows."
        functionName:
          type: string
          description: "`t.function_name or ''` — empty string rather than null; always '' on UTXO rows."
        utxoFlowKind:
          type: string
          enum: [OUTGOING, INCOMING, COINBASE, SELF, MIXED]
          description: UTXO rows only. Raw `flow_kind` before the direction mapping.
        utxoValueBasis:
          type: string
          enum: [exact_transfer, received, coinbase, self_zero, not_attributable]
          description: UTXO rows only. How `value` was derived, or that it could not be.
        utxoAttributionExact:
          type: boolean
          description: UTXO rows only. `outbound_attribution_exact or inbound_source_attribution_exact`; both default False, so never null.
        utxoExternalOutputCount: { type: integer, description: UTXO rows only. }
        feeSats: { type: string, description: UTXO rows only. Decimal string. }
        balanceDeltaSats: { type: string, description: UTXO rows only. Decimal string; the subject's net balance change. }
    TokenTransfer:
      type: object
      description: |
        Token transfer entry. Serializer: `token_tx_history.append({...})` in web/api/main.py
        (most recent 50). `tokenSymbol` / `tokenName` are non-Optional on the TokenTransfer
        dataclass, so they are strings rather than nullable.
      properties:
        hash: { type: string }
        timestamp: { type: integer, description: Unix seconds. }
        direction: { type: string, enum: [in, out] }
        counterparty: { type: string }
        counterpartyLabel:
          oneOf:
            - $ref: '#/components/schemas/CounterpartyLabel'
            - type: 'null'
          description: Same raw `LabelEntry` object as on Transaction, or null.
        tokenSymbol: { type: string }
        tokenName: { type: string }
        value: { type: string, description: "`str(t.value_formatted)` — decimal string, not the raw base-unit amount." }
    ContractDeployment:
      type: object
      description: |
        Contract deployed by the address. Serializer: `deployments_data.append({...})` in
        web/api/main.py. Note `timestamp` here is an ISO-8601 STRING
        (`datetime.fromtimestamp(...).isoformat()`), unlike the integer timestamps on
        Transaction / TokenTransfer.
      properties:
        txHash: { type: string }
        timestamp: { type: string, format: date-time }
        contractAddress: { type: string }
        contractName:
          type: [string, 'null']
          description: "`Optional[str] = None` on the dataclass — present only when the contract is verified."
        isVerified: { type: boolean }
        gasUsed: { type: integer }
        gasCost: { type: string, description: "Human-formatted, e.g. \"0.0012 ETH\"." }
        gasCostWei: { type: integer, description: "`gas_used * gas_price`, a JSON number." }
    AnalysisResult:
      type: object
      properties:
        address: { type: string }
        network: { type: string }
        riskScore: { type: [integer, 'null'], minimum: 0, maximum: 100, description: "Null while async scan is queued/analyzing." }
        riskLevel: { type: [string, 'null'], enum: [critical, high, medium, low, null] }
        riskContributions:
          type: [object, 'null']
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 100
          description: |
            Per-component risk contribution scores, 0-100. Keys are the
            seven scorer components (mixer_interaction, sanctioned_contact,
            behavioral_patterns, counterparty_risk, timing_anomalies,
            contract_risk, fund_flow_topology). Null on pre-explainability
            Modal versions. Honest invariant:
              base_score ≈ round(Σ riskContributions[k] × riskWeights[k])
            The final `riskScore` may still be higher than base_score
            because critical override floors (sanctioned, exploit, frozen,
            mixer, transit_massive, ...) are applied separately. Surfacing
            which floor fired is planned for a future PR.
        riskWeights:
          type: [object, 'null']
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
          description: |
            Effective per-component weights actually used for THIS scoring
            run, after custom_weights validation/normalization and EOA
            redistribution. NOT the static module-default weights.

            **EOA redistribution rule:** when the analyzed target is an
            externally-owned account (EOA), the `contract_risk` weight is
            zeroed and its share is proportionally redistributed across
            `mixer_interaction`, `sanctioned_contact`, and
            `behavioral_patterns`. A user who PATCHed their saved
            `custom_weights` with e.g. `contract_risk: 0.20` will therefore
            see `riskWeights.contract_risk: 0` on an EOA target — the
            value was applied, then redistributed by the scorer. This
            transformation is intentional and only affects EOA targets;
            contract targets see weights as PATCHed. (F-R — #52.2 docs
            hardening.)

            Sum of values is 1.0 (within float tolerance). Keys are the
            same seven components as `riskContributions` so the two maps
            can be zipped client-side. Null on pre-explainability Modal
            versions.
        riskReasons:
          type: array
          description: |
            Ranked, typed reasons explaining the `riskScore`. Each entry
            is either a `floor` (an override floor that was applied) or
            a `component` (a non-zero per-component contribution to the
            base score).

            Sort order is deterministic and stable across runs:
              1. `impactScore` descending,
              2. `kind` ascending (`floor` before `component`),
              3. `code` ascending alphabetical.

            Empty array when `riskScore` is `null` (insufficient data)
            or when no signal exceeded the minimum-impact threshold.
            Older servers may omit the field entirely — clients should
            default to `[]` if absent.

            Floor reasons carry the matching flag subset in
            `supportingFlags`. Component reasons emit `supportingFlags: []`
            in this PR; per-component flag attribution is planned for a
            later PR.
          items:
            $ref: '#/components/schemas/RiskReason'
        riskConfidence:
          type: string
          enum: [high, medium, low]
          description: |
            Confidence in the reported `riskScore` based on data
            completeness. **Behavior change**: this enum was previously
            `[high, low]` and now includes `medium`. Tier semantics:
              - `high`: fully complete tx fetch, exact funded_by, no
                token-flow extraction crash, no coverage downgrade.
              - `medium`: partial-but-substantial data
                (`completeness_pct ≥ 60`), or any tx-count coverage
                downgrade (approximate / subset_only / unknown), or
                `token_flow_incomplete`, or `funded_by_status` in
                {approximate, unavailable}.
              - `low`: `riskScore` was nulled due to low completeness,
                or provider returned `api_error`, or partial-fetch with
                `completeness_pct < 60` (or unknown).
            See `riskConfidenceDetails` for the specific reasons that
            drove the tier on this particular response.
        riskConfidenceDetails:
          type: [object, 'null']
          description: |
            Structured explanation of why a particular `riskConfidence`
            tier was selected. Null on pre-explainability Modal versions
            (in that case `riskConfidence` is still emitted with a tier
            value, just without the breakdown).
          properties:
            tier:
              type: string
              enum: [high, medium, low]
              description: Same value as `riskConfidence`.
            completeness_pct:
              type: [number, 'null']
              minimum: 0
              maximum: 100
              description: |
                Fraction of reported transaction history actually
                fetched. Null when the upstream provider doesn't expose
                a reliable total (some non-EVM chains).
            reasons:
              type: array
              items:
                type: string
                enum:
                  - tx_count_coverage_subset
                  - tx_count_coverage_approximate
                  - tx_count_coverage_unknown
                  - tx_fetch_incomplete_limit_cap
                  - tx_fetch_incomplete_api_error
                  - token_flow_incomplete
                  - funded_by_approximate
                  - funded_by_unavailable
                  - score_unavailable_low_completeness
              description: |
                Public-contract identifiers for each completeness signal
                that contributed to the tier. Order is deterministic
                (alphabetical) and the list is deduplicated. Empty when
                tier is `high`. A `low` tier may include medium-level
                reasons too — clients should render the full list rather
                than only the most-severe entry.
        reportId: { type: string, format: uuid }
        status:
          $ref: '#/components/schemas/ReportStatus'
        errorMessage:
          type: [string, 'null']
          description: Populated when `status='failed'`.
        createdAt:
          type: string
          format: date-time
          description: Initial creation timestamp of this report row.
        addressInfo:
          type: object
          properties:
            type: { type: string, enum: [eoa, contract, smart_contract, unknown], description: "Address type. `contract` and `smart_contract` are aliases — both mean a deployed contract; clients should treat them equivalently." }
            balance:
              # OpenAPI 3.1 union rather than legacy `nullable: true`: this document declares
              # 3.1, where `nullable` is not a valid keyword (every existing use of it is part
              # of the pre-existing redocly `struct` baseline, untouched here).
              type: [string, "null"]
              example: "1.5 ETH"
              description: |
                Native balance, formatted with the network unit. `null` means the provider
                established NO balance (absent/failed/unknown upstream) and MUST NOT be
                treated as zero — the analyzer deliberately does not substitute a synthetic
                `"0"`, so a provider-confirmed zero is the string `"0"` while unknown is
                `null`.
            balanceUsd: { type: [number, 'null'], example: 3045.50 }
            nativePriceUsd: { type: [number, 'null'], example: 2030.33 }
            txCount:
              type: [integer, "null"]       # 3.1 union — see the note on `balance` above
              description: |
                Lifetime transaction count. `null` means the provider established NO count
                (absent/failed/unknown upstream) and MUST NOT be treated as zero; a
                provider-confirmed zero is `0`.
            firstSeen: { type: [string, 'null'] }
            lastSeen: { type: [string, 'null'] }
            totalReceived:
              type: [string, 'null']
              example: "9.96239376 BTC"
              description: |
                Cumulative native amount EVER received by this address, formatted with the
                network unit. Present only for networks whose chain summary establishes
                lifetime totals (currently the UTXO chains: `btc`, `ltc`); `null` or absent
                means UNKNOWN and MUST NOT be treated as zero.

                This is the forensically meaningful figure for a swept address: `balance` can
                be a correct `0` while this shows that ~10 BTC moved through. It is a lifetime
                total from the chain summary, NOT a sum of the returned `transactionHistory`
                (which is a capped window and would understate it).
            totalReceivedRaw:
              type: [string, 'null']
              example: "996239376"
              description: "`totalReceived` in the smallest native unit (satoshis for BTC, litoshis for LTC), as a string to avoid precision loss."
            totalSent:
              type: [string, 'null']
              example: "9.96239376 BTC"
              description: "Cumulative native amount EVER sent from this address. Same semantics and caveats as `totalReceived`."
            totalSentRaw:
              type: [string, 'null']
              example: "996239376"
              description: "`totalSent` in the smallest native unit (satoshis for BTC, litoshis for LTC), as a string."
            nativeFlowSource:
              type: [string, 'null']
              example: "mempool_chain_stats"
              description: "Which authority established the cumulative totals, so proof is distinguishable from assumption. `null` when they were not established."
        patternFlags:
          type: array
          items: { type: string }
          description: |
            Legacy display strings, kept for backward compatibility. For
            localization use `code` / `templateKey` from `patternFlagDetails`
            (index-aligned with this array).
          example: ["BULK COLLECTION pattern: 24 inbound TXs in 600s", "OFAC/sanctions list match"]
        patternFlagDetails:
          type: array
          description: |
            Localization-friendly metadata, index-aligned with `patternFlags`.
            Use `code` / `templateKey` for translation/mapping. `defaultEn` is
            a display fallback only (may include dynamic values; not stable
            across releases).
          items:
            $ref: '#/components/schemas/FlagDetail'
          example:
            - code: bulk_collection
              templateKey: pattern.bulk_collection
              defaultEn: "BULK COLLECTION pattern: 24 inbound TXs in 600s"
              severity: medium
              description: "Many sources sent funds within a short window (bulk collection)."
            - code: ofac_sanctions_match
              templateKey: pattern.ofac_sanctions_match
              defaultEn: "OFAC/sanctions list match"
              severity: critical
              description: "Address matches an OFAC/sanctions list."
        topCounterparties:
          type: array
          items:
            type: object
            properties:
              address: { type: string }
              label: { type: [string, 'null'] }
              category: { $ref: '#/components/schemas/CategoryEnum' }
              txCount: { type: integer }
              totalValue: { type: string }
              inbound: { type: boolean }
        addressConnections:
          type: array
          description: |
            Aggregated counterparty category breakdown by total interaction volume (inbound + outbound)
            across up to 30 counterparties returned by the analyzer. Percentages rounded to 1 decimal,
            sum may be 99.0–101.0 due to rounding.
          items:
            $ref: '#/components/schemas/AddressConnection'
          example:
            - category: exchange
              percentage: 64.0
              valueFormatted: "15,000 TRX"
              valueRaw: "15000000000"
              unit: sun
            - category: sanctioned
              percentage: 23.9
              valueFormatted: "5,600 TRX"
              valueRaw: "5600000000"
              unit: sun
            - category: unknown
              percentage: 12.1
              valueFormatted: "2,835 TRX"
              valueRaw: "2835000000"
              unit: sun
        fundedBy:
          type: [object, 'null']
          properties:
            address: { type: string }
            label: { type: [string, 'null'] }
            txHash: { type: string }
            timestamp: { type: integer }
            value: { type: string }
        timing:
          type: [object, 'null']
          description: |
            Transaction timing analysis. Includes legacy `botFlags` (display
            strings) and `botFlagDetails` (localization-friendly metadata,
            index-aligned with `botFlags`). Other fields (hourly/daily
            distribution, regularityScore, etc.) are returned as-is from
            the analyzer.
          properties:
            botFlags:
              type: array
              items: { type: string }
              description: Legacy display strings, kept for backward compatibility. For localization use `code` / `templateKey` from `botFlagDetails`.
              example: ["Active across 22+ hours daily — likely automated"]
            botFlagDetails:
              type: array
              description: Localization-friendly metadata, index-aligned with `botFlags`.
              items:
                $ref: '#/components/schemas/FlagDetail'
              example:
                - code: always_on_24h
                  templateKey: bot.always_on_24h
                  defaultEn: "Active across 22+ hours daily — likely automated"
                  severity: medium
                  description: "Address is active for ~22+ hours per day, suggesting automation."
        crossChain: { type: [object, 'null'] }
        exchangeDeposits:
          oneOf:
            - $ref: '#/components/schemas/ExchangeDepositsValid'
            - $ref: '#/components/schemas/ExchangeDepositsInvalidated'
            - type: 'null'
          description: >-
            A valid exchange-deposit summary, an M2-C2
            historical-attribution-invalidated sentinel (persisted reports only;
            never produced by live analysis), or null. Legacy valid objects do
            not carry a `status` field. Structurally distinguishable without a
            discriminator: the invalidated variant has `status` + `curation` and
            no numeric fields; the valid variant has the numeric fields.
        destinationEntities:
          type: array
          description: >-
            Per-transfer destination-entity evidence. Always an array: it is []
            when unavailable, in sandbox, or when the report owner's current
            effective plan is not entitled to destination_entity_evidence.
            Internal dedup identifiers are never exposed.
          items:
            $ref: '#/components/schemas/DestinationEntityRecord'
        destinationEntitySummary:
          oneOf:
            - $ref: '#/components/schemas/DestinationEntitySummary'
            - type: 'null'
          description: >-
            Aggregate over detected destination entities, or null when
            unavailable, in sandbox, or the owner's current effective plan is
            not entitled.
        defiSwaps: { type: [object, 'null'] }
        nftWashTrading: { type: [object, 'null'] }
        osintIntelligence: { type: [object, 'null'] }
        tokenFlow: { type: [object, 'null'] }
        contractAnalysis:
          $ref: '#/components/schemas/ContractAnalysis'
        contractInfo:
          $ref: '#/components/schemas/ContractInfo'
        dataCompleteness:
          $ref: '#/components/schemas/DataCompleteness'
        honeypot:
          oneOf:
            - $ref: '#/components/schemas/Honeypot'
            - type: 'null'
        railgun: { type: [object, 'null'] }
        clusters: { type: [object, 'null'] }
        usdPrices: { type: [object, 'null'] }
        # ── #735 Slice 1A ────────────────────────────────────────────────────────
        # Eight fields the paid runtime has always returned and this spec omitted. Added as
        # DOCUMENTATION only: every shape is read off the current response builder in
        # web/api/src/routes/check.js, with the runtime expression quoted. The runtime is
        # unchanged, AnalysisResult declares no `required` list, and all eight are optional —
        # so no existing paid client is affected.
        labels:
          type: array
          # `data.label ? [normalizeLabel(data.label)] : []` — always an array, never null, at
          # most one entry today. A null ITEM is reachable: normalizeLabel returns
          # `lbl.label || lbl.name || null`, so a truthy label object carrying neither key
          # yields `[null]`. Documented rather than smoothed over — a client typing this as
          # non-nullable strings would break on exactly that response.
          items: { type: [string, 'null'] }
          description: Address labels. At most one entry today; an entry may be null when the upstream label object carries neither `label` nor `name`.
        transactionHistory:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
          description: "Native transaction entries. Runtime: `data.transactionHistory || data.transaction_history || []` — always an array, never null."
        tokenTransferHistory:
          type: array
          items: { $ref: '#/components/schemas/TokenTransfer' }
          description: "Token transfer entries. Runtime: `data.tokenTransferHistory || data.token_transfer_history || []` — always an array, never null."
        contractDeployments:
          type: array
          items: { $ref: '#/components/schemas/ContractDeployment' }
          description: "Contracts deployed by this address. Runtime: `data.contract_deployments || []` — always an array, never null."
        tokenScore: { type: [object, 'null'], description: "Token scoring detail when the subject is a token contract. Runtime: `data.token_score || null`." }
        temporalClusters: { type: [object, 'null'], description: "Temporal clustering detail. Runtime: `data.temporal_clusters || null`." }
        riskNote: { type: [string, 'null'], description: "Free-text qualifier on the score. Runtime: `data.risk_note || null`." }
        dataQuality:
          type: string
          # Runtime: `data.data_quality || 'full'`. The enum is the OBSERVED vocabulary — 'full'
          # is the Worker's own default and the backend emits 'partial' and 'limited'
          # (web/api/main.py). 'degraded' appears nowhere in the runtime; openapi-sandbox.yaml
          # claims [full, partial, degraded], which is wrong in both directions. Reported in the
          # Slice 1 return; not changed here, because Slice 1 documents paid truth only.
          enum: [full, partial, limited]
          description: Completeness class of the underlying data. `full` is the default when the backend sends none.
        tokenTransferSupported: { type: [boolean, 'null'], description: "Whether token transfer data is available for this network" }
        tokenFlowIncomplete: { type: [boolean, 'null'], description: "True if token flow data is partial due to API failures" }
        walletArchetype: { type: [string, 'null'], enum: [automated, distribution, exchange_like, mev_like, unclassified, null], description: "SOL wallet behavior classification" }
        partialReason:
          type: [string, 'null']
          enum: [timeout, limit_cap, limit_cap_assumed, api_error, btc_tx_count_exceeds_full_fetch_limit, ltc_tx_count_exceeds_full_fetch_limit, heavy_contract_overview, null]
          description: |
            Reason for partial transaction data. Mirrors `dataCompleteness.partialReason` for clients
            that only inspect the top level. `heavy_contract_overview` indicates the address is a
            deployed contract with `txCount >= 50000` and the analyzer returned bytecode-level
            metadata only — full transaction-level tracing is not available for this contract.
        analysisTime: { type: integer, description: "Milliseconds" }
        timestamp: { type: string, format: date-time }
        coverage:
          $ref: '#/components/schemas/Coverage'
        access:
          $ref: '#/components/schemas/ReportAccess'
        export:
          $ref: '#/components/schemas/ReportExport'
        name:
          type: [string, 'null']
          description: |
            Caller-assigned report name. Emitted by `GET /api/reports/{id}` only
            (`row.name || null`); the fresh-scan responses do not carry it.

    ReportStatus:
      type: string
      description: |
        Lifecycle of an async report:
          `queued`    — POST /check accepted; consumer worker has not picked it up yet.
          `analyzing` — consumer started; partial fields may exist.
          `complete`  — analysis written; full result available via GET /api/reports/{reportId}.
          `failed`    — terminal error; `errorMessage` populated.
      enum: [queued, analyzing, complete, failed]

    # ───────────────────────────────────────────────────────────────────────────────
    # #735 Batch 1B — success bodies for 19 published operations that declared none.
    #
    # Every shape below is read off the handler's own return construction, not from one
    # observed response: token-check.js / block.js / multichain.js / investigate.js +
    # ai/orchestrator.js / watchlist.js / labels.js, plus schema.sql for the column types the
    # row-returning routes pass through verbatim.
    #
    # Two runtime facts the reader needs. First, `utils/response.js` exports `json` as an
    # ALIAS of `success`, so these routes do carry the standard `{ success, data }` envelope
    # even though they call `json(...)`. Second, several of them return a D1 ROW as-is, so the
    # payload is snake_case and shaped by the table — that is the contract, and it is recorded
    # here rather than tidied into camelCase.
    # ───────────────────────────────────────────────────────────────────────────────

    OkFlagResponse:
      type: object
      description: |
        Bare acknowledgement: `DELETE /api/watchlist/{id}`, `DELETE /api/labels/{id}` and
        `POST /api/notifications/telegram/disconnect` all answer `{ "success": true, "data":
        { "success": true } }`. The inner `success` is the handler's own payload
        (`json({ success: true })`) and is NOT the envelope flag — reading `data.success`
        rather than the envelope is what a client should do here.
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [success]
          properties:
            success: { type: boolean, enum: [true] }

    TokenReportListItem:
      type: object
      description: Projected list row — NOT the stored token report; `reportData` is not included.
      properties:
        id: { type: integer }
        address: { type: string }
        network: { type: string }
        tokenName: { type: [string, "null"] }
        tokenSymbol: { type: [string, "null"] }
        securityScore: { type: [number, "null"] }
        isHoneypot:
          type: boolean
          description: Coerced from the stored integer, so it is always a boolean here (never null).
        name: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    TokenReportListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [reports, total]
          properties:
            reports: { type: array, items: { $ref: '#/components/schemas/TokenReportListItem' } }
            total:
              type: integer
              description: Total rows for this account, ignoring `limit`/`offset`.

    BlockReportListItem:
      type: object
      properties:
        id: { type: integer }
        blockNumber: { type: integer }
        network: { type: string }
        name: { type: [string, "null"] }
        sandwichCount: { type: [integer, "null"] }
        arbitrageCount: { type: [integer, "null"] }
        jitCount: { type: [integer, "null"] }
        liquidationCount: { type: [integer, "null"] }
        txCount: { type: [integer, "null"] }
        createdAt: { type: string, format: date-time }

    BlockReportListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [reports, total]
          properties:
            reports: { type: array, items: { $ref: '#/components/schemas/BlockReportListItem' } }
            total: { type: integer }

    BlockReportResponse:
      type: object
      description: |
        The stored block report. `{id}` accepts either the UUID `public_id` that `POST
        /api/v1/block/reports` returned or the legacy integer `id`; a purely numeric ref is
        read as the legacy id and anything else as a `public_id`, so an unknown ref simply
        404s.
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [id, blockNumber, network, reportData, createdAt]
          properties:
            id: { type: integer }
            reportPublicId: { type: [string, "null"] }
            blockNumber: { type: integer }
            network: { type: string }
            name: { type: [string, "null"] }
            reportData:
              type: object
              additionalProperties: true
              description: |
                The stored analysis payload, returned as parsed JSON. Deliberately NOT
                constrained here: it is whatever the analyzer wrote at save time, and an
                unparsable or absent payload is returned as `{}` rather than failing the read.
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    MultichainReportListItem:
      type: object
      properties:
        id: { type: integer }
        address: { type: string }
        name: { type: [string, "null"] }
        activeChains: { type: [integer, "null"] }
        totalChains: { type: [integer, "null"] }
        status:
          type: string
          description: Defaults to `complete` when the stored row has no status.
        compositeRiskScore: { type: [number, "null"] }
        compositeRiskLevel: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    MultichainReportListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [reports, total]
          properties:
            reports: { type: array, items: { $ref: '#/components/schemas/MultichainReportListItem' } }
            total: { type: integer }

    MultichainReportResponse:
      type: object
      description: |
        The stored multi-chain report. `{id}` accepts the UUID `public_id` or the legacy
        integer `id`, exactly as the block-report read does.
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [id, address, status, reportData, createdAt]
          properties:
            id: { type: integer }
            reportPublicId: { type: [string, "null"] }
            address: { type: string }
            activeChains: { type: [integer, "null"] }
            totalChains: { type: [integer, "null"] }
            status: { type: string }
            compositeRiskScore: { type: [number, "null"] }
            compositeRiskLevel: { type: [string, "null"] }
            name: { type: [string, "null"] }
            reportData:
              type: object
              additionalProperties: true
              description: Parsed stored payload; `{}` when absent or unparsable. Not constrained.
            createdAt: { type: string, format: date-time }

    InvestigationListItem:
      type: object
      description: |
        A D1 row returned VERBATIM by the list query, so the keys are snake_case and the
        joined subject columns are null for every subject kind this row is not. Exactly one
        subject family is populated per row: report (`report_*`), block (`block_*`), token
        (`token_*`) or tokenized asset (`rwa_*`). `messages` is NOT included in the list.
      properties:
        id: { type: integer }
        title: { type: [string, "null"] }
        status: { type: string, enum: [active, limit_reached, archived] }
        message_count: { type: [integer, "null"] }
        tool_calls_count: { type: [integer, "null"] }
        tokens_used: { type: [integer, "null"] }
        report_id: { type: [string, "null"] }
        report_type: { type: [string, "null"] }
        created_at: { type: integer, description: "Unix seconds, as stored." }
        updated_at: { type: integer, description: "Unix seconds, as stored." }
        report_address: { type: [string, "null"] }
        report_network: { type: [string, "null"] }
        report_risk_score: { type: [integer, "null"] }
        report_risk_level: { type: [string, "null"] }
        block_number: { type: [integer, "null"] }
        block_network: { type: [string, "null"] }
        block_name: { type: [string, "null"] }
        token_address: { type: [string, "null"] }
        token_network: { type: [string, "null"] }
        token_symbol: { type: [string, "null"] }
        token_score: { type: [number, "null"] }
        rwa_name: { type: [string, "null"] }
        rwa_contract: { type: [string, "null"] }
        rwa_chain_id: { type: [integer, "null"] }

    InvestigationListResponse:
      type: object
      description: |
        Archived investigations are excluded. A tokenized-asset investigation is visible only
        while the caller currently has RWA access, and the SAME predicate drives `total`, so a
        hidden row never inflates the count or breaks pagination.
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [investigations, total]
          properties:
            investigations: { type: array, items: { $ref: '#/components/schemas/InvestigationListItem' } }
            total: { type: integer }

    InvestigationResponse:
      type: object
      description: |
        One investigation with its conversation. The payload is the stored row (snake_case)
        plus a parsed `messages` array.

        **History can be withheld without failing the read.** When the caller's CURRENT access
        to the linked report is only PREVIEW, `messages` comes back EMPTY with
        `history_unavailable: true` and a `history_reason` — a 200, not an error. Absence of
        those two keys means the history is complete.
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [investigation]
          properties:
            investigation:
              type: object
              required: [id, status, messages]
              properties:
                id: { type: integer }
                user_id: { type: integer }
                title: { type: [string, "null"] }
                status: { type: string, enum: [active, limit_reached, archived] }
                message_count: { type: [integer, "null"] }
                tool_calls_count: { type: [integer, "null"] }
                tokens_used: { type: [integer, "null"] }
                report_id: { type: [string, "null"] }
                report_type: { type: [string, "null"] }
                created_at: { type: integer }
                updated_at: { type: integer }
                messages:
                  type: array
                  description: |
                    The stored conversation, parsed from JSON (`[]` when absent). Message
                    objects are the agent transcript as written and are deliberately not
                    constrained here.
                  items:
                    type: object
                    additionalProperties: true
                history_unavailable:
                  type: boolean
                  description: Present and `true` only when history was withheld; otherwise absent.
                history_reason:
                  type: string
                  description: Present only alongside `history_unavailable`.

    InvestigationArchivedResponse:
      type: object
      description: |
        `DELETE` ARCHIVES the investigation (`status = 'archived'`); it does not delete the
        row. Archiving one that is already archived answers 404, so this is not idempotent.
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [archived]
          properties:
            archived: { type: boolean, enum: [true] }

    WatchlistItem:
      type: object
      description: |
        A D1 `watchlist` row returned VERBATIM, so keys are snake_case and the booleans are
        stored integers (`0`/`1`), not JSON booleans.
      properties:
        id: { type: integer }
        user_id: { type: integer }
        address: { type: string }
        network: { type: string }
        label: { type: [string, "null"] }
        notify_email: { type: [integer, "null"] }
        notify_telegram: { type: [integer, "null"] }
        notify_webhook: { type: [integer, "null"] }
        threshold_value: { type: [number, "null"] }
        threshold_max: { type: [number, "null"] }
        track_all: { type: [integer, "null"] }
        last_checked_at: { type: [integer, "null"] }
        last_tx_hash: { type: [string, "null"] }
        last_balance: { type: [string, "null"] }
        is_contract: { type: [integer, "null"] }
        deployer_address: { type: [string, "null"] }
        is_active: { type: [integer, "null"] }
        created_at: { type: integer }
        updated_at: { type: [integer, "null"] }

    WatchlistListResponse:
      type: object
      description: Only active entries are listed; a removed entry is soft-deleted and disappears.
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, page, limit]
          properties:
            items:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/WatchlistItem'
                  - type: object
                    properties:
                      alert_count:
                        type: integer
                        description: Alerts recorded for this entry. Present on the LIST only.
            total: { type: integer }
            page: { type: integer }
            limit: { type: integer }

    WatchlistItemResponse:
      type: object
      description: |
        Returned by both `POST /api/watchlist` (201) and `PATCH /api/watchlist/{id}` (200).

        `POST` is an UPSERT on `(account, address, network)`: posting an address you already
        watch updates that entry and re-activates it if it had been removed, rather than
        creating a second one or conflicting. It still answers `201`.
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [item]
          properties:
            item: { $ref: '#/components/schemas/WatchlistItem' }

    WatchlistAlert:
      type: object
      description: A D1 `watchlist_alerts` row returned VERBATIM (snake_case; integer flags).
      properties:
        id: { type: integer }
        watchlist_id: { type: integer }
        user_id: { type: integer }
        alert_type:
          type: string
          enum: [new_tx, large_tx, balance_change, risk_change, new_counterparty]
        tx_hash: { type: [string, "null"] }
        details:
          type: [string, "null"]
          description: Stored as a JSON STRING, not an object — parse it client-side.
        notified_email: { type: [integer, "null"] }
        notified_telegram: { type: [integer, "null"] }
        notified_webhook: { type: [integer, "null"] }
        created_at: { type: integer }

    WatchlistAlertListResponse:
      type: object
      description: Alerts for one watchlist entry. An unknown or unowned `{id}` answers 404.
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [alerts, total, page, limit]
          properties:
            alerts: { type: array, items: { $ref: '#/components/schemas/WatchlistAlert' } }
            total: { type: integer }
            page: { type: integer }
            limit: { type: integer }

    AlertListResponse:
      type: object
      description: |
        Alerts across the whole account. Each row is a `watchlist_alerts` row joined with its
        watchlist entry, so it additionally carries that entry's `address`, `network` and
        `label`. Note the default page size here is 50, not the 20 used by the per-entry list.
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [alerts, total, page, limit]
          properties:
            alerts:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/WatchlistAlert'
                  - type: object
                    properties:
                      address: { type: string }
                      network: { type: string }
                      label: { type: [string, "null"] }
            total: { type: integer }
            page: { type: integer }
            limit: { type: integer }

    CustomLabelRow:
      type: object
      description: |
        The STABLE PUBLIC PROJECTION of a custom label row — these nine fields and no others,
        in snake_case, with unix-second integer timestamps.

        It is not a raw dump of the underlying row. Every path that returns a label (list, create,
        update) selects this fixed column set explicitly, so a column added to the underlying
        table does NOT appear here: a new field is a contract change, published with its schema.
      properties:
        id: { type: integer }
        user_id: { type: integer }
        address: { type: string }
        network: { type: string }
        label: { type: string }
        category: { type: string }
        notes: { type: [string, "null"] }
        created_at: { type: integer }
        updated_at: { type: [integer, "null"] }

    LabelItemResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [item]
          properties:
            item: { $ref: '#/components/schemas/CustomLabelRow' }

    NotificationSettingsRowResponse:
      type: object
      description: |
        `PATCH` answers with the STORED ROW wrapped in `settings` — a different shape from
        `GET /api/notifications/settings`, which answers a flat camelCase projection. The two
        are not interchangeable, and that asymmetry is recorded here rather than normalised.

        **`webhook_secret` is NOT part of this contract.** It is a value YOU supply in the
        request body; nothing in the API is specified to return it, `GET
        /api/notifications/settings` does not, and no client should read it back from here.
        Treat your own copy as the authority.
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [settings]
          properties:
            settings:
              type: object
              additionalProperties: true
              properties:
                id: { type: integer }
                user_id: { type: integer }
                telegram_chat_id: { type: [string, "null"] }
                telegram_enabled: { type: [integer, "null"] }
                webhook_url: { type: [string, "null"] }
                webhook_enabled: { type: [integer, "null"] }
                email_enabled: { type: [integer, "null"] }
                daily_digest: { type: [integer, "null"] }
                created_at: { type: integer }
                updated_at: { type: [integer, "null"] }

    TelegramLinkResponse:
      type: object
      description: |
        A single-use deep link that binds the Telegram account which opens it to this account.
        The `token` expires after 10 minutes. Treat both values as secrets: anyone who opens
        the link binds THEIR Telegram account to YOUR OnChainRisk account.

        Answers `503 TELEGRAM_BOT_USERNAME_REQUIRED` when the environment has no bot
        configured.
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [link, token]
          properties:
            link: { type: string, format: uri }
            token: { type: string }

    AnalysisResponse:
      type: object
      description: |
        The REAL HTTP body of POST /api/v1/check on the synchronous path.

        The HTTP 200 response for this endpoint uses the standard `{ success, data }` envelope —
        the handler serializes exactly `{ success: true, data: <result> }`. The 200 used to
        declare bare `AnalysisResult`, which described the INNER payload rather than the body on
        the wire, so a generated client looked for `riskScore` at the top level and found
        `success` there instead.

        The async path returns 202 with `AsyncQueuedResponse` — the same envelope, a different
        payload.
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/AnalysisResult' }

    AsyncQueuedResponse:
      type: object
      description: |
        202 response from POST /api/v1/check when the analysis takes the async
        path (heavy address). The reportId is stable across the in-flight window —
        a deduplicated retry returns the same id with `deduplicated: true`.

        A FRESH acceptance always reports `queued` and omits `deduplicated`
        entirely. A DEDUPLICATED retry reports the existing lifecycle's current
        status, which is `queued` or `analyzing` — never a terminal status,
        because a `complete` or `failed` report is not a dedupe candidate.
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [reportId, status, async]
          properties:
            reportId:
              type: string
              format: uuid
              description: Public id of the queued report. Use with /api/v1/check/status/{reportId}.
            status:
              type: string
              enum: [queued, analyzing]
              description: |
                `queued` on a fresh acceptance — always, since a new lifecycle
                is zero seconds old. On a deduplicated retry this is the
                EXISTING lifecycle's current status, so it may be `analyzing`.

                Terminal statuses never appear here: only an in-flight
                lifecycle deduplicates, so `complete` and `failed` are
                unreachable on this response. Read
                `GET /api/v1/check/status/{reportId}` for the full
                `ReportStatus` vocabulary.
            async:
              type: boolean
              enum: [true]
              description: Discriminator. Always true on this response.
            deduplicated:
              type: boolean
              description: |
                Present and `true` ONLY when this 202 returned an existing
                in-flight lifecycle's id instead of creating a new one. Absent
                entirely on a fresh acceptance — do not treat `false` and
                missing as different.

                Within a 30-minute window, a repeat POST for the same
                `(owning account, canonical address, network)` is idempotent
                and creates no new charge and no new queue job — provided the
                existing lifecycle is still in flight. Ownership is the
                ACCOUNT, so another key on the same account deduplicates
                against it too.

    ScanStatusResponse:
      type: object
      description: |
        The REAL HTTP body of GET /api/v1/check/status/{reportId}.

        The HTTP 200 response for this endpoint uses the standard `{ success, data }` envelope —
        the handler returns `success(scanStatusFrom(...))`, and `utils/response.js::success()`
        serializes exactly this shape. The 200 used to declare bare `ScanStatus`, which described
        the INNER payload rather than the body on the wire, and the published examples (which did
        carry the envelope) contradicted it. A generated client built against the old schema
        would have looked for `status` at the top level and found `success` there instead.
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/ScanStatus' }

    ReportResponse:
      type: object
      description: |
        The REAL HTTP body of GET /api/reports/{id} — the same `{ success, data }` envelope.

        `data` is EITHER a complete `AnalysisResult` OR the lightweight body returned for every
        non-complete status (`failed` included).

        **anyOf, not oneOf, and that is deliberate.** The two branches are not distinguishable by
        schema: `AnalysisResult` has no required properties, and the lightweight body's six
        properties all exist on it as optionals — so a lightweight payload satisfies BOTH branches
        and a strict `oneOf` validator rejects a response the API genuinely sends. The route has
        no discriminator field to add without changing paid runtime, so the honest composition is
        `anyOf`.

        **Branch on whether `data.status` is PRESENT**, not on its value:

        * `data.status` **absent** → the complete `AnalysisResult`. A complete report carries
          no `status` field at all.
        * `data.status` **present and not `complete`** → the lightweight body (`queued`,
          `analyzing` or `failed`).

        Testing `data.status === 'complete'` never matches, because the complete branch omits
        the field entirely. The server's own `if (row.status && row.status !== 'complete')`
        tests the STORED ROW, not the response payload, and must not be transcribed as a
        client rule.
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          anyOf:
            - $ref: '#/components/schemas/AnalysisResult'
            - type: object
              description: |
                Non-complete report — analysis not written. Returned for `queued`, `analyzing`
                AND `failed`; on `failed`, `errorMessage` is populated.
              required: [reportId, status]
              properties:
                reportId: { type: string }
                address: { type: string }
                network: { type: string }
                status: { $ref: '#/components/schemas/ReportStatus' }
                errorMessage: { type: [string, 'null'] }
                createdAt: { type: string, format: date-time }

    ScanStatus:
      type: object
      description: |
        Polling response from GET /api/v1/check/status/{reportId}. Lightweight
        summary safe to poll every ~5 seconds. Once `status === 'complete'`,
        the full report is available via GET /api/reports/{reportId}.
      required: [reportId, status]
      properties:
        reportId: { type: string, format: uuid }
        status:
          $ref: '#/components/schemas/ReportStatus'
        phase:
          type: [string, 'null']
          description: |
            Free-form phase label set by the consumer worker while
            `status='analyzing'` (e.g. `fetching_transactions`). Cleared
            (`null`) on completion. Treat as observability hint, not API.
        errorMessage:
          type: [string, 'null']
          description: Populated when `status='failed'`.
        riskScore:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Set when `status='complete'`. `null` otherwise.
        riskLevel:
          type: [string, 'null']
          enum: [critical, high, medium, low, null]
        queuedAt:    { type: [string, 'null'], format: date-time }
        startedAt:   { type: [string, 'null'], format: date-time }
        finishedAt:  { type: [string, 'null'], format: date-time }

    DestinationEntityRecord:
      type: object
      description: >-
        One direct single-hop OUTGOING transfer to a labelled destination
        entity. Amounts are integer base units encoded as decimal strings.
        Internal dedup identifiers and debug fields are never present.
      properties:
        displayLabel: { type: string }
        entityName:
          type: [string, 'null']
          description: Structured entity name when available; otherwise null.
        entityType:
          type: string
          enum:
            - centralized_exchange
            - vasp
            - otc_desk
            - custodian
            - payment_processor
            - fiat_on_off_ramp
            - other_service
        destinationAddress: { type: string }
        transactionHash: { type: string }
        timestamp: { type: integer }
        network: { type: string }
        direction: { type: string, enum: [outgoing] }
        hopCount: { type: integer }
        amountRaw:
          type: string
          description: >-
            Integer base-unit amount as an exact decimal string (never a JSON
            number — precision above 2**53 would be lost).
        amountFormatted: { type: string }
        asset: { type: string }
        assetType: { type: string, enum: [native, token] }
        assetAddress:
          type: [string, 'null']
          description: Token contract/mint; null for native assets.
        assetDecimals: { type: integer }
        labelSource: { type: string }
        attributionBasis:
          type: string
          enum: [provenance_backed, manual_known_address, user_custom]
        confidenceLevel:
          type: [string, 'null']
          enum: [high, medium, low, null]
        attributionEvidenceType: { type: [string, 'null'] }
    DestinationEntityAssetTotal:
      type: object
      description: Per-asset total; native and token base units are never summed.
      properties:
        asset: { type: string }
        assetType: { type: string, enum: [native, token] }
        assetAddress: { type: [string, 'null'] }
        assetDecimals: { type: integer }
        amountRaw:
          type: string
          description: Integer base-unit total as an exact decimal string.
        amountFormatted: { type: string }
        transferCount: { type: integer }
    DestinationEntityHistoryDisclosure:
      type: object
      description: >-
        Transaction-history completeness disclosure, derived only from scan-wide
        completeness state. null/where-unknown values are honest.
      properties:
        complete: { type: boolean }
        transactionHistoryComplete: { type: boolean }
        tokenHistoryComplete:
          type: [boolean, 'null']
          description: true, false, or null when token transfers are not applicable.
        transactionCoverage:
          type: string
          enum: [exact, approximate, subset_only, unknown]
        transactionFetchIncomplete: { type: boolean }
        tokenTransferSupported: { type: boolean }
        tokenFlowIncomplete: { type: boolean }
        analyzedTransactions: { type: integer }
        totalTransactions: { type: [integer, 'null'] }
        completenessPct: { type: [number, 'null'] }
        partialReason: { type: [string, 'null'] }
        tokenPartialReason: { type: [string, 'null'] }
        windowDescription: { type: string }
        note: { type: string }
    DestinationEntitySummary:
      type: object
      description: Aggregate over detected destination entities.
      properties:
        assetTotals:
          type: array
          items:
            $ref: '#/components/schemas/DestinationEntityAssetTotal'
        totalDetected: { type: integer }
        recordsReturned: { type: integer }
        truncated: { type: boolean }
        historyDisclosure:
          oneOf:
            - $ref: '#/components/schemas/DestinationEntityHistoryDisclosure'
            - type: 'null'
    ContractAnalysis:
      type: [object, 'null']
      description: |
        Contract bytecode analysis. Returned for deployed contracts (`addressInfo.type` =
        `contract` or `smart_contract`); `null` for EOAs and addresses with no bytecode.

        **Stable shape contract** — `similarityFlags` and `knownSignatures` are always
        arrays (possibly empty). For heavy contracts (`txCount >= 50000`) the analyzer
        returns a minimal object with bytecode metadata only; backend normalizes the
        shape so consumers can rely on these fields existing without runtime guards.
      properties:
        contractName: { type: [string, 'null'], example: "Router" }
        bytecodeSize:
          type: [integer, 'null']
          description: "Bytecode length in bytes. `null` when unknown — clients should render `Unknown`, never `0`."
          example: 6177
        compilerVersion: { type: [string, 'null'], example: "v0.8.16+commit.07a7930e" }
        deployer: { type: [string, 'null'], example: "0xabc..." }
        isVerified: { type: boolean, example: true }
        hasSelfdestruct: { type: boolean }
        hasDelegatecall: { type: boolean }
        hasCreate2: { type: boolean }
        similarityFlags:
          type: array
          items: { type: string }
          description: "Pattern matches against known exploit fingerprints. Empty array when none."
        knownSignatures:
          type: array
          items: { type: string }
          description: "Decoded function signatures recognized in bytecode. Empty array when none."

    ContractInfo:
      type: [object, 'null']
      description: "Deployment + proxy metadata. Distinct from `contractAnalysis` (bytecode analysis)."
      properties:
        deployer: { type: [string, 'null'] }
        creationTx: { type: [string, 'null'] }
        creationBlock: { type: [integer, 'null'] }
        isProxy:
          type: boolean
          description: "True when the contract is a proxy (EIP-1967 / minimal proxy / etc.) verified against on-chain implementation slot. Inferred-only fallbacks are NOT reflected here."
        implementationAddress: { type: [string, 'null'], description: "Set when `isProxy` is true and the implementation is resolvable." }
        contractName: { type: [string, 'null'] }

    DataCompleteness:
      type: [object, 'null']
      description: "Transaction fetch completeness signals. Drives partial-data UX and `heavy_contract_overview` marker."
      properties:
        reportedTxCount: { type: integer, description: "Total tx count as reported by chain stats / explorer." }
        fetchedTxCount: { type: integer, description: "Number of transactions actually parsed end-to-end." }
        completenessPct: { type: [number, 'null'], description: "100 × fetched / reported, rounded; `null` if reported is 0." }
        partialReason:
          type: [string, 'null']
          enum: [timeout, limit_cap, limit_cap_assumed, api_error, btc_tx_count_exceeds_full_fetch_limit, ltc_tx_count_exceeds_full_fetch_limit, heavy_contract_overview, null]
          description: |
            Why the data is partial. `heavy_contract_overview` is set automatically when the
            address is a deployed contract with `txCount >= 50000` AND the analyzer returned
            a minimal contract metadata shape (bytecode only). UIs should show "overview only"
            copy in this case rather than treating absence of activity as no-activity.

    CategoryEnum:
      type: string
      description: Counterparty category from label database
      enum:
        - exchange
        - dex
        - defi
        - bridge
        - otc
        - mev_bot
        - instant_exchange
        - phishing
        - mixer
        - scam
        - exploit
        - sanctioned
        - frozen
        - custodian
        - fiat_ramp
        - payment_processor
        - unknown

    RiskReason:
      type: object
      required:
        - code
        - kind
        - severity
        - title
        - templateKey
        - description
        - impactScore
        - supportingFlags
        - evidence
      description: |
        One ranked, typed reason contributing to the final `riskScore`.
        See the `riskReasons` field on `AnalysisResult` for ordering
        semantics. The `code` enum is locked as part of the public
        contract — additions require explicit review.
      properties:
        code:
          type: string
          description: |
            Stable machine-readable identifier. Locked enum.

            **Floor codes** (prefix `floor_`) — an override-floor that
            was applied to `riskScore` because a high-severity signal
            fired. Each floor reason carries the matching flag subset
            in `supportingFlags`.

            **Customizable floors (14)** — the floors below the
            `floor_honeypot` / `floor_excessive_tax` /
            `floor_low_token_score` group are user-customizable via
            `PATCH /api/user/risk-settings` (`overrides` field) on the
            Business plan. The 14 customizable keys are: `sanctioned`,
            `exploit`, `scam`, `phishing`, `frozen`, `mixer`,
            `perm_hijack`, `transit`, `transit_massive`, `railgun`,
            `railgun_low_anon`, `campaign`, `campaign_heavy`,
            `flag_density`. Worker / Modal / Dashboard align on this
            14-key set as of 2026-05-20 (PR #77 / PR #78).

            **Token-security floors (3, hardcoded)** —
            `floor_honeypot`, `floor_excessive_tax`,
            `floor_low_token_score` are not part of the customizable
            surface. Their floor values are fixed (80 / 70 / 60) and
            cannot be tuned via `custom_overrides`. (F-I — #52.2 docs
            hardening; revisit if user signal warrants promotion to
            customizable.)

            **Component codes** — the seven scorer components (same
            keys as `riskContributions` / `riskWeights`). Each
            component reason represents a non-zero contribution to the
            base score. Component reasons emit `supportingFlags: []`
            in this version.
          enum:
            - floor_sanctioned
            - floor_exploit
            - floor_scam
            - floor_phishing
            - floor_frozen
            - floor_mixer
            - floor_perm_hijack
            - floor_transit
            - floor_transit_massive
            - floor_railgun
            - floor_railgun_low_anon
            - floor_campaign
            - floor_campaign_heavy
            - floor_flag_density
            - floor_honeypot
            - floor_excessive_tax
            - floor_low_token_score
            - mixer_interaction
            - sanctioned_contact
            - behavioral_patterns
            - counterparty_risk
            - timing_anomalies
            - contract_risk
            - fund_flow_topology
        kind:
          type: string
          enum: [floor, component]
          description: |
            `floor` — an override-floor was applied (the score is
            forced to at least `impactScore`).

            `component` — a non-zero per-component contribution to the
            base score with magnitude `impactScore`.
        severity:
          type: string
          enum: [critical, high, medium, low]
          description: |
            Bucket for the reason's significance. `critical` is reserved
            for sanctioned / exploit / scam floor reasons; component
            reasons never surface as `critical`.
        title:
          type: string
          description: Short human-readable English label.
          example: "Sanctioned address — score floor applied"
        templateKey:
          type: string
          description: |
            Namespaced i18n key. `reason.floor.<code-suffix>` for floor
            reasons, `reason.component.<code>` for component reasons.
          example: reason.floor.sanctioned
        description:
          type: string
          description: |
            Short stable English explanation. May include dynamic
            integers (e.g. the floor minimum that was applied). Do not
            use as a translation key.
          example: "Address is on a sanctions / OFAC list. The risk score is forced to at least 95."
        impactScore:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Floors: the minimum score the floor enforced (e.g. 95 for
            sanctioned). Components: `round(riskContributions[code] *
            riskWeights[code])`, i.e. the honest contribution to the
            base score before any floor. Always used as the primary
            ranking key (DESC).
        supportingFlags:
          type: array
          items: { type: string }
          description: |
            For floor reasons, the subset of `flags` (verbatim rendered
            strings) that matched the floor's predicate. For component
            reasons in this version, always an empty array.
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/RiskEvidence'
          description: |
            Task #63 PR 4 — structured observations supporting this
            reason. Always an array; never null. Phase 1 populates
            evidence rows for **floor-level reasons only**; component
            reasons (`mixer_interaction`, `sanctioned_contact`,
            `behavioral_patterns`, `counterparty_risk`,
            `timing_anomalies`, `contract_risk`, `fund_flow_topology`)
            return `evidence: []` in this version — that surface is
            planned for a follow-up PR.

            New evidence `kind` values may be added in future versions
            on a strictly additive basis; clients SHOULD treat the
            `kind` enum as forward-compatible (an unknown value MUST
            NOT crash a client).

            Worker-side normalization: a pre-PR-4 Modal that omits
            this field on a reason has its reason coerced to
            `evidence: []` at the Worker boundary so the "always an
            array" contract holds regardless of which side deployed
            first.

    RiskEvidence:
      type: object
      required:
        - kind
        - observedAt
      description: |
        One structured observation supporting a `RiskReason`. Shape is
        a flat tagged-union: every row has `kind` + `observedAt` plus
        kind-specific optional fields. Clients dispatch on `kind` and
        read only the fields documented for that kind.

        **`observedAt` is the scorer-run timestamp** — the moment the
        analysis was performed by the engine that produced THIS
        response. It is **NOT** the original source publication
        timestamp (e.g. when OFAC added an address to its list, or
        when chainabuse received a report). True source-add timestamps
        are not tracked in this version.

        Evidence rows are derived from observations already collected
        for the response (the floor's `supportingFlags` subset, the
        OSINT result block, the internal address label catalog). No
        new fetches are performed to build this list.

        Phase 1 emits at most the first three of the four locked
        kinds. `counterparty_interaction` is reserved in the schema
        but not emitted in Phase 1.
      properties:
        kind:
          type: string
          enum:
            - osint_match
            - internal_label
            - pattern_predicate
            - counterparty_interaction
          description: |
            Locked enum. Additions are a public-contract change and
            require explicit review.

            * `osint_match` — the address is on a public OSINT list
              (sanctions, scam DBs, phishing DBs, chainabuse community
              reports). Fields: `source`, `matchedList`, `label`,
              `detail?`, and for chainabuse rows the optional pair
              `chainabuseCategories` + `chainabuseReportCount`.

            * `internal_label` — the address has a hit in the
              internal address-label catalog. Fields: `source`
              (always `internal`), `label`.

            * `pattern_predicate` — an analysis predicate fired on
              the observed activity (e.g. `transit_wallet`,
              `perm_hijack_detected`). Fields: `predicate` (stable
              slug), `label` (human-readable), `flagText`
              (the raw `flags` entry that triggered it; may be null
              for synthesized meta-predicates like
              `high_flag_density`), `detail?`.

            * `counterparty_interaction` — RESERVED for Phase 2. Will
              carry `address`, `label`, `interactionCount`,
              `lastInteractionAt`, `valueUsd`. Phase 1 never emits
              this kind.
        observedAt:
          type: string
          format: date-time
          description: |
            Scorer-run timestamp (ISO-8601 with timezone offset).
            Shared across every evidence row in a single response.
            NOT a source publication or label-added timestamp.
        source:
          type: string
          description: |
            Origin of the evidence. For `osint_match`: the OSINT
            source identifier (e.g. `chainabuse`, `ofac`, `osint`).
            For `internal_label`: always `internal`. Omitted on
            `pattern_predicate`.
        matchedList:
          type: string
          description: |
            For `osint_match` rows: the specific list within the
            source (e.g. `chainabuse_reports`, `scam_list`,
            `phishing_list`). Omitted on other kinds.
        label:
          type: string
          description: |
            Human-readable label for the evidence:
            * `osint_match` — the label string from the OSINT source
              (e.g. the scam label, or a fallback like "Known
              phishing address" when the source did not provide one).
            * `internal_label` — the internal catalog entry text.
            * `pattern_predicate` — short human-readable label for
              the predicate (e.g. "Transit wallet pattern").
            * `counterparty_interaction` — the counterparty's label
              (Phase 2).
        detail:
          type: [string, 'null']
          description: |
            Optional free-form detail string for any kind. Currently
            used by `pattern_predicate` for the `high_flag_density`
            meta-predicate (e.g. `"12 flags fired"`). Null when not
            applicable.
        chainabuseCategories:
          type: array
          items: { type: string }
          description: |
            For chainabuse `osint_match` rows: the categories
            (e.g. `["scam", "phishing"]`) reported by the community.
            Omitted on other rows.
        chainabuseReportCount:
          type: integer
          minimum: 0
          description: |
            For chainabuse `osint_match` rows: the total reported
            count. Omitted on other rows.
        predicate:
          type: string
          description: |
            For `pattern_predicate` rows: the stable predicate slug
            (e.g. `transit_wallet`, `perm_hijack_detected`,
            `sanctioned_self_label`, `high_flag_density`). Unknown
            future flag patterns may surface as `unknown_predicate`
            so the invariant "floor with supportingFlags > 0 ⇒
            evidence > 0" holds without a Modal redeploy. Omitted on
            other kinds.
        flagText:
          type: [string, 'null']
          description: |
            For `pattern_predicate` rows: the raw `flags` entry that
            triggered the predicate. Null for synthesized meta-
            predicates (e.g. `high_flag_density`). Omitted on other
            kinds.
        address:
          type: string
          description: |
            RESERVED for `counterparty_interaction` (Phase 2). The
            counterparty address.
        interactionCount:
          type: integer
          minimum: 1
          description: |
            RESERVED for `counterparty_interaction` (Phase 2).
        lastInteractionAt:
          type: [string, 'null']
          format: date-time
          description: |
            RESERVED for `counterparty_interaction` (Phase 2).
        valueUsd:
          type: [number, 'null']
          description: |
            RESERVED for `counterparty_interaction` (Phase 2).

    Honeypot:
      type: object
      required: [status]
      description: |
        Honeypot verification result on `POST /api/v1/token/check` (and
        the streaming variant). The `status` field indicates whether the
        verification was actionable. **Read `status` BEFORE relying on
        any measurable field.**

        `isHoneypot` is `null` for all non-ok statuses. Treating
        `isHoneypot === null` as `false` ("not a honeypot") is incorrect;
        null means "unknown".

        Saving a non-ok result via `POST /api/v1/token/reports` is **not
        charged** — see the cost summary at the top of this spec and the
        CHANGELOG entry for `honeypot.status`.

        Reason codes (when `status != "ok"`):
        - `provider_rate_limited` — upstream provider rate-limited the
          honeypot detector.
        - `provider_error` — upstream provider error (network, timeout,
          5xx, etc.).
        - `analyzer_error` — internal analyzer exception.
        - `network_not_supported` — detector is unavailable for this
          network/setup.
        - `no_data` — no on-chain DEX pair found or token contract
          inconclusive.
      properties:
        status:
          type: string
          enum: [ok, unable_to_verify, not_supported, no_data]
        reason:
          type: [string, 'null']
          enum:
            - provider_rate_limited
            - provider_error
            - analyzer_error
            - network_not_supported
            - no_data
            - null
        isHoneypot:
          type: [boolean, 'null']
          description: |
            True/false ONLY when `status="ok"`. Null for all non-ok statuses.
            Null means "unknown" — NOT "not a honeypot".
        buyTax: { type: [number, 'null'] }
        sellTax: { type: [number, 'null'] }
        buySuccess: { type: [boolean, 'null'] }
        sellSuccess: { type: [boolean, 'null'] }
        transferPausable: { type: [boolean, 'null'] }
        hasBlacklist: { type: [boolean, 'null'] }
        hasMaxTx: { type: [boolean, 'null'] }
        hasCooldown: { type: [boolean, 'null'] }
        liquidityLocked: { type: [boolean, 'null'] }
        liquidityAmount: { type: [number, 'null'] }
        pairAddress: { type: [string, 'null'] }
        dexName: { type: [string, 'null'] }
        flags:
          type: [array, 'null']
          items: { type: string }
        riskLevel:
          type: [string, 'null']

    FlagDetail:
      type: object
      required: [code, templateKey, defaultEn]
      description: |
        Localization-friendly flag metadata. Use `code` / `templateKey` for
        translation/mapping. `defaultEn` is a display fallback only — it
        may include dynamic values and is not stable across releases.
        Pattern flags use the `pattern.*` namespace; bot flags (under
        `timing.botFlagDetails`) use the `bot.*` namespace.
      properties:
        code:
          type: string
          description: Stable machine-readable identifier. Use this for translation/mapping.
          example: bulk_collection
        templateKey:
          type: string
          description: Namespaced i18n key. `pattern.<code>` for pattern flags, `bot.<code>` for bot flags.
          example: pattern.bulk_collection
        defaultEn:
          type: string
          description: Current English display fallback. May include dynamic values. Do not use as translation key.
          example: "BULK COLLECTION pattern: 24 inbound TXs in 600s"
        severity:
          type: [string, 'null']
          enum: [critical, high, medium, low, null]
          example: medium
        description:
          type: [string, 'null']
          description: Short stable English explanation of the flag meaning.
          example: "Many sources sent funds within a short window (bulk collection)."

    AddressConnection:
      type: object
      description: Aggregated interaction volume for a single counterparty category
      required: [category, percentage, valueFormatted, valueRaw, unit]
      properties:
        category:
          $ref: '#/components/schemas/CategoryEnum'
        percentage:
          type: number
          description: "Percentage of total interaction volume (0.0–100.0)"
          example: 64.0
        valueFormatted:
          type: string
          description: "Human-readable value with network unit (display-only)"
          example: "15,000 TRX"
        valueRaw:
          type: string
          description: "Raw value in network base units (wei, sun, satoshi, etc.) for programmatic use"
          example: "15000000000"
        unit:
          type: string
          description: "Base unit name for the network (wei, sun, satoshi, lovelace, etc.)"
          example: "sun"

    GraphSnapshot:
      type: object
      description: Graph snapshot metadata (no graphData payload)
      required: [id, reportId, name, nodeCount, edgeCount, createdAt, updatedAt]
      properties:
        id: { type: integer, example: 42 }
        reportId: { type: string, description: "Report public_id" }
        name: { type: string, maxLength: 100, example: "After expanding counterparties" }
        description: { type: [string, 'null'], maxLength: 500 }
        nodeCount: { type: integer, description: "Computed server-side from graphData.nodes" }
        edgeCount: { type: integer, description: "Computed server-side from graphData.edges" }
        createdAt: { type: integer, description: "Unix timestamp (seconds)" }
        updatedAt: { type: integer, description: "Unix timestamp (seconds)" }

    GraphSnapshotFull:
      allOf:
        - $ref: '#/components/schemas/GraphSnapshot'
        - type: object
          required: [graphData]
          properties:
            graphData:
              type: object
              required: [nodes, edges]
              properties:
                nodes: { type: array, items: { type: object } }
                edges: { type: array, items: { type: object } }
