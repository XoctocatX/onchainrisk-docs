        '200':
          description: Investigations list (offset-paged)

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationListResponse'
  # ── Watchlist ─────────────────────────────────────────
  /api/watchlist:
    get:
      tags: [Watchlist]
      summary: List watchlist items
      security:
        - apiKeyAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: limit
          in: query
          description: Page size. Values above the maximum are clamped, not rejected.
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: Watchlist items with alert counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistListResponse'
    post:
      tags: [Watchlist]
      summary: Add address to watchlist
      description: |
        Monitor an address for new transactions. Alerts delivered via email, Telegram, or webhook. Checked every 5 minutes.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, network]
              properties:
                address: { type: string }
                network:
                  type: string
                  description: |
                    Only networks the alert monitor can actually poll are accepted. This is
                    narrower than the `/api/v1/check` network set on purpose: enrolment is
                    fail-closed, so a network outside this list is rejected with
                    400 `WATCHLIST_NETWORK_UNSUPPORTED` rather than silently never alerting.
                  enum: [eth, bsc, btc, sol, tron, arbitrum, optimism, base, polygon, avalanche, linea, celo, moonbeam]
                label: { type: string }
                threshold_value: { type: number, description: "Min value to alert" }
                notify_email: { type: boolean, default: true }
                notify_telegram: { type: boolean, default: false }
                notify_webhook: { type: boolean, default: false }
      responses:
        '201':
          description: Watchlist item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistItemResponse'
        '400':
          description: |
            Missing address/network, an address that fails family validation, or a network
            outside the monitored set (`WATCHLIST_NETWORK_UNSUPPORTED`).
        '403':
          description: Plan watchlist limit reached

  # ── Labels ────────────────────────────────────────────
  /api/labels:
    get:
      tags: [Labels]
      summary: List user custom labels
      security:
        - apiKeyAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: limit
          in: query
          description: Page size. Values above the maximum are clamped, not rejected.
          schema: { type: integer, default: 50, maximum: 100 }
        - name: search
          in: query
          description: Case-insensitive substring match on address and label.
          schema: { type: string }
      responses:
        '200':
          description: User labels
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [items, total, page, limit]
                    properties:
                      items:
                        type: array
                        description: |
                          `custom_labels` rows returned VERBATIM — snake_case keys and
                          unix-second timestamps, the same representation
                          `PATCH /api/labels/{id}` answers with.
                        items: { $ref: '#/components/schemas/CustomLabelRow' }
                      total:
                        type: integer
                        description: Matching rows for this account, ignoring `page`/`limit`.
                      page: { type: integer }
                      limit: { type: integer }
    post:
      tags: [Labels]
      summary: Create a custom label
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, label]
              properties:
                address: { type: string }
                network:
                  type: string
                  default: eth
                  description: |
                    Label scope. Narrower than the analysis network set — a network outside
                    this list is rejected with 400. Omit to default to `eth`.
                  enum: [eth, bsc, tron, btc, sol, ton, arbitrum, optimism, base, polygon, avalanche, linea, zksync]
                label: { type: string, maxLength: 200 }
                category:
                  type: string
                  default: custom
                  description: |
                    Free-form tag. Non-alphanumeric characters are stripped and the value is
                    truncated to 50 characters; an empty result becomes `custom`.
                notes:
                  type: string
                  maxLength: 500
                  description: Longer values are truncated to 500 characters, not rejected.
      responses:
        '200':
          description: |
            Label stored. The handler answers **200**, not 201. It is an UPSERT on
            `(account, address, network)`: posting an address you have already labelled
            OVERWRITES that label rather than creating a second one or conflicting, and the
            stored row is returned either way.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelItemResponse'
  /api/labels/{id}:
    patch:
      tags: [Labels]
      summary: Update a label
      security:
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Partial update — every field is optional and an omitted field keeps its
                stored value. String fields are truncated to their maximum rather than
                rejected.
              properties:
                label: { type: string, maxLength: 200 }
                category:
                  type: string
                  description: |
                    Non-alphanumeric characters are stripped and the value is truncated to
                    50 characters; an empty result becomes `custom`.
                notes: { type: [string, 'null'], maxLength: 500 }
                network:
                  type: string
                  description: Re-scope the label. Rejected with 400 if outside this list.
                  enum: [eth, bsc, tron, btc, sol, ton, arbitrum, optimism, base, polygon, avalanche, linea, zksync]
      responses:
        '200':
          description: Label updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelItemResponse'
        '400': { description: Unsupported network }
        '404': { description: Label not found }
    delete:
      tags: [Labels]
      summary: Delete a label
      security:
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Label deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkFlagResponse'
        '404': { description: Label not found }

  /api/labels/import:
    post:
      tags: [Labels]
      summary: Bulk import labels
      description: Bulk-create labels. Duplicates (same address+network) are skipped.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [labels]
              properties:
                labels:
                  type: array
                  items:
                    type: object
                    required: [address, network, label, category]
                    properties:
                      address: { type: string }
                      network: { type: string }
                      label: { type: string }
                      category: { type: string }
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [imported, updated, errors]
                    properties:
                      imported:
                        type: integer
                        description: Rows inserted as new labels.
                      updated:
                        type: integer
                        description: |
                          Rows that matched an existing `(address, network)` for this account and
                          were overwritten. The import is an upsert, so a re-import reports
                          `updated`, not `imported`.
                      errors:
                        type: array
                        description: One entry per rejected row; empty when every row was accepted.
                        items: { type: string }
                      warning:
                        type: string
                        description: |
                          Present ONLY when the resulting label count exceeds the plan limit. The
                          import still succeeded; the warning says some labels may be removed.
  /api/labels/export:
