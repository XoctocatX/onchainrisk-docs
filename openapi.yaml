  # ── Saved Reports ─────────────────────────────────────
  /api/v1/token/reports:
    post:
      tags: [Saved Reports]
      summary: Save a token security report
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, network, reportData]
              properties:
                address: { type: string }
                network: { type: string }
                reportData: { type: object }
      responses:
        '201':
          description: Token report saved, and a credit was charged.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [id, charged]
                    properties:
                      id:
                        type: string
                        description: |
                          The report's PUBLIC id (a UUID) — what `GET /api/v1/token/reports`
                          lists and what later reads accept, NOT the integer row id.
                      tokenSymbol: { type: [string, "null"] }
                      securityScore: { type: [number, "null"] }
                      charged: { type: boolean, enum: [true] }
        '200':
          description: |
            Nothing new was saved and NOTHING WAS CHARGED. Two reachable cases, both 200:

            * **duplicate** — a report for this token already exists, so its id comes back with
              `duplicate: true`.
            * **honeypot verification not actionable** — the stored honeypot result was not
              usable, so `id` is `null`, no report was saved and no credit was taken; the
              `honeypot` block says why.

            Read `charged` rather than the status code if what you need to know is whether this
            call cost a credit.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    oneOf:
                      - type: object
                        description: Duplicate — the existing report's id is returned.
                        required: [id, duplicate, charged]
                        properties:
                          id: { type: string }
                          tokenSymbol: { type: [string, "null"] }
                          securityScore: { type: [number, "null"] }
                          duplicate: { type: boolean, enum: [true] }
                          charged: { type: boolean, enum: [false] }
                      - type: object
                        description: Honeypot verification was not actionable; nothing saved.
                        required: [id, duplicate, charged, honeypot, message]
                        properties:
                          id: { type: "null" }
                          duplicate: { type: boolean, enum: [false] }
                          charged: { type: boolean, enum: [false] }
                          honeypot:
                            type: object
                            required: [status]
                            properties:
                              status: { type: string }
                              reason: { type: [string, "null"] }
                          message: { type: string }
    get:
      tags: [Saved Reports]
      summary: List saved token reports
      security:
        - apiKeyAuth: []
      parameters:
        - name: limit
          in: query
          description: Page size. Values above the maximum are clamped, not rejected.
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          description: Zero-based row offset. This surface pages by offset, not page number.
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: Saved token reports (offset-paged)

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenReportListResponse'
  /api/v1/block/reports:
    post:
      tags: [Saved Reports]
      summary: Save a block analysis (MEV) report
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blockNumber, network, reportData]
              properties:
                blockNumber: { type: integer }
                network: { type: string }
                reportData: { type: object }
      responses:
        '200':
          description: |
            Report saved. The handler answers **200**, not 201 — every success path resolves an
            EXISTING analysis (optionally renaming it), and no code path answers 201. A legacy
            cached analysis with no public id cannot be saved and answers
            `410 LEGACY_CACHE_NO_SAVE`.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [id, reportId, reportPublicId]
                    properties:
                      id:
                        type: integer
                        description: Integer row id.
                      reportId:
                        type: [string, "null"]
                        description: The report's public id (UUID) — prefer this for later reads.
                      reportPublicId:
                        type: [string, "null"]
                        description: Same value as `reportId`; both keys are emitted.
    get:
      tags: [Saved Reports]
      summary: List saved block reports
      security:
        - apiKeyAuth: []
      parameters:
        - name: limit
          in: query
          description: Page size. Values above the maximum are clamped, not rejected.
