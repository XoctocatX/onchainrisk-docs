              schema:
                type: string
                description: |
                  CSV with the header row `address,network,label,category,notes`, one row per
                  label, values quoted only when they contain a comma, quote or newline. Sent
                  with `Content-Disposition: attachment; filename="custom-labels.csv"`.

                  This endpoint does NOT return JSON and is not wrapped in the
                  `{ success, data }` envelope.
  # ── Notifications ─────────────────────────────────────
  /api/notifications/settings:
    get:
      tags: [Notifications]
      summary: Get notification settings
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Notification preferences
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    description: |
                      A flat camelCase PROJECTION of the stored row — not the row itself. The
                      stored integer flags are coerced to JSON booleans here, and
                      `telegramConnected` is derived (a chat id is bound), not stored.

                      `PATCH /api/notifications/settings` answers a DIFFERENT shape — the stored
                      row wrapped in `settings`. The two are not interchangeable.
                    required: [emailEnabled, telegramEnabled, telegramConnected, webhookUrl, webhookEnabled, dailyDigest]
                    properties:
                      emailEnabled: { type: boolean }
                      telegramEnabled: { type: boolean }
                      telegramConnected:
                        type: boolean
                        description: True when a Telegram chat is bound to this account.
                      webhookUrl: { type: [string, "null"] }
                      webhookEnabled: { type: boolean }
                      dailyDigest:
                        type: boolean
                        description: Send one daily summary instead of instant alerts.
    patch:
      tags: [Notifications]
      summary: Update notification settings
      description: |
        Account-level notification configuration. Used by watchlist alert
        delivery (per-item `notify_email` / `notify_telegram` / `notify_webhook`
        flags decide which channels fire for that address).

        All fields are optional; PATCH semantics — provided fields are
        updated, omitted fields are preserved. Webhook delivery to the
        configured URL is signed with HMAC SHA-256 (`X-Signature-256` header)
        when `webhook_secret` is set. See `docs/integration/webhooks.md`.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Partial update. All fields optional. The values returned by
                `GET /api/notifications/settings` mirror the persisted state.
              properties:
                email_enabled:
                  type: boolean
                  description: Email channel master toggle.
                telegram_chat_id:
                  type: [string, 'null']
                  description: |
                    Telegram chat ID (numeric string). Set after the user
                    completes the Telegram connect flow via the dashboard.
                    Pass `null` to clear.
                telegram_enabled:
                  type: boolean
                  description: Telegram channel master toggle.
                webhook_url:
                  type: [string, 'null']
                  format: uri
                  description: |
                    HTTPS endpoint that will receive watchlist alert POSTs.
                    Pass `null` to clear.
                webhook_secret:
                  type: [string, 'null']
                  description: |
                    Shared secret used to compute the `X-Signature-256` HMAC
                    header on outbound webhooks. Recommended ≥32 characters.
                    Pass `null` to clear (webhooks will then be sent unsigned).
                webhook_enabled:
                  type: boolean
                  description: Webhook channel master toggle.
                daily_digest:
                  type: boolean
                  description: |
                    Collapse email alerts into one daily summary. Webhooks
                    remain instant regardless of this flag.
      responses:
        '200':
          description: Settings saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettingsRowResponse'

