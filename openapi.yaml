        caller.
      security:
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Report id — UUID reportPublicId (preferred) or legacy integer id.
          schema: { type: string }
      responses:
        '200':
          description: Saved block report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockReportResponse'
        '401':
          description: Unauthorized
        '404':
          description: Report not found or not owned by the caller

