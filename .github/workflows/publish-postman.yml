# Publish the reviewed Postman artifacts in this repository to Postman cloud.
#
# THREE ARTIFACTS since the #748 cutover, each independently verifiable: ONE canonical collection
# used with EITHER of two environments. This replaced two per-tier collections, which stated that
# paid and sandbox are different integrations; they are one integration with two credentials.
# The old sandbox CLOUD collection is retained and deprecated rather than deleted — users may
# have imported or forked it — and this workflow does not touch it.
#
# AUTHORITY. The checked-in JSON is the publication source. It arrives by mirror sync from
# XoctocatX/onchainrisk, which already gates OpenAPI <-> Postman conformance, so this workflow
# never regenerates a collection from OpenAPI and never treats Postman as a source of truth:
#
#     CORE canonical -> production served artifacts -> this mirror -> Postman cloud
#
# and a write to any one of the three never implies a write to another. `verify` issues none.
#
# TRUST MODEL. A pull request runs validation ONLY and has no access to the publishing
# credential — the publish job is gated on `github.event_name` and on the ref being main, and
# `pull_request_target` is deliberately not used, so no secret-bearing step ever executes
# against an untrusted ref. Publication is additionally narrowed by a path filter: editing the
# README, the CHANGELOG, an integration doc or this workflow does not republish anything.
#
# REQUIRED REPOSITORY CONFIGURATION (set once, by a maintainer):
#   secret    POSTMAN_API_KEY                  a Postman API key with update rights on the three
#                                              targets below — the canonical collection and the
#                                              two environments — and nothing else
#   variable  POSTMAN_COLLECTION_ID            the Postman CLOUD id of "OnChainRisk API"
#   variable  POSTMAN_PRODUCTION_ENVIRONMENT_ID  the CLOUD id of "OnChainRisk Production"
#   variable  POSTMAN_SANDBOX_ENVIRONMENT_ID     the CLOUD id of "OnChainRisk Sandbox"
#   variable  POSTMAN_AUTOPUBLISH_ENABLED      the activation kill switch — see below
#
# No checked-in file carries a cloud id. The generated collection carries no `info._postman_id`
# at all -- the cloud id and uid live only on the remote, and are copied into the payload so a PUT
# preserves the cloud document. Each environment's top-level `id` is a human-readable DOCUMENT
# identifier: comparison drops it and the PUT substitutes the configured cloud id. The script
# refuses to guess a cloud id, and has no create path for any of the three targets.
#
# ACTIVATION. Nothing can be written until POSTMAN_AUTOPUBLISH_ENABLED is EXACTLY the string
# 'true'. Unset, empty, 'false', 'TRUE', '1' and 'yes' all leave publication disabled, and the
# gate is enforced twice over — in the job condition below and again inside the script, so
# editing one does not silently enable writes. The read-only `verify` dispatch stays available
# the whole time, which is how the first real target is inspected:
#
#   1. merge this workflow to main with POSTMAN_AUTOPUBLISH_ENABLED unset
#   2. configure the secret and the three target-id variables: POSTMAN_COLLECTION_ID,
#      POSTMAN_PRODUCTION_ENVIRONMENT_ID and POSTMAN_SANDBOX_ENVIRONMENT_ID
#   3. run workflow_dispatch -> mode: verify, and read the reported target identities,
#      normalized hashes and ACTION
#   4. only after that result is independently accepted, set POSTMAN_AUTOPUBLISH_ENABLED=true
#   5. then authorize a publish dispatch, or let the next reviewed change to a published
#      artifact publish

name: Publish Postman artifacts

on:
  pull_request:
    paths:
      - 'onchainrisk_api_collection.json'
      - 'production.postman_environment.json'
      - 'sandbox.postman_environment.json'
      - '.github/workflows/publish-postman.yml'
      - '.github/scripts/**'
  push:
    branches: [main]
    # Publication path filter: ONLY a change to one of the three published artifacts republishes.
    paths:
      - 'onchainrisk_api_collection.json'
      - 'production.postman_environment.json'
      - 'sandbox.postman_environment.json'
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          inventory = read-only listing of what exists in Postman cloud, with a disposition per
          object. verify = read-only comparison of the three configured targets.
          publish = write when the remote differs.
        required: true
        default: verify
        type: choice
        options: [inventory, verify, publish]

# Read-only. Publication writes to Postman, never to this repository.
permissions:
  contents: read

# One publication at a time, and never interrupted: cancelling between the PUT and its
# verification would leave the remote state unconfirmed.
concurrency:
  group: postman-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate published artifacts (no secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the ref under test
        # actions/checkout v4, pinned to its immutable commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Node version floor
        run: |
          node --version
          node -e 'const [maj] = process.versions.node.split("."); if (Number(maj) < 20) { console.error("Node 20+ required"); process.exit(1); }'

      - name: The collection and both environments parse and carry unambiguous identities
        run: node .github/scripts/postman-sync.mjs --selftest

      - name: Publisher unit tests
        run: node --test ".github/scripts/test/*.test.mjs"

      - name: No secret-shaped material committed
        run: |
          if grep -rEn 'PMAK-[A-Za-z0-9]{8,}|eyJ[A-Za-z0-9_-]{20,}|ocr_(live|test|sandbox)_[A-Za-z0-9]{12,}' \
               --include='*.json' --include='*.md' --include='*.mjs' --include='*.yml' . ; then
            echo "secret-shaped material found — see matches above" >&2
            exit 1
          fi
          echo "clean"

  publish:
    name: Publish to Postman
    # Never from a pull request, never from a ref other than main, and never while the
    # activation variable is anything other than the exact string 'true'.
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.POSTMAN_AUTOPUBLISH_ENABLED == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'))
    needs: validate
    runs-on: ubuntu-latest
    environment: postman
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Publish, then verify the remote matches this repository
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_COLLECTION_ID: ${{ vars.POSTMAN_COLLECTION_ID }}
          POSTMAN_PRODUCTION_ENVIRONMENT_ID: ${{ vars.POSTMAN_PRODUCTION_ENVIRONMENT_ID }}
          POSTMAN_SANDBOX_ENVIRONMENT_ID: ${{ vars.POSTMAN_SANDBOX_ENVIRONMENT_ID }}
          POSTMAN_AUTOPUBLISH_ENABLED: ${{ vars.POSTMAN_AUTOPUBLISH_ENABLED }}
        run: node .github/scripts/postman-sync.mjs --publish

  inventory:
    name: Inventory Postman cloud (read-only)
    # Deliberately NOT gated on POSTMAN_AUTOPUBLISH_ENABLED, and deliberately NOT restricted to
    # `main`: the inventory exists to be run BEFORE anything is configured or merged, which is
    # when the three target ids are still unknown. It is safe from any ref because the script it
    # runs cannot write -- see .github/scripts/postman-inventory.mjs, whose only network
    # primitive hard-codes `method: 'GET'` and takes no method argument. Triggering a dispatch
    # already requires write access to this repository.
    #
    # It cannot fall through into publication: `publish` requires mode == 'publish' (or a push to
    # main), `verify-only` requires mode == 'verify', and neither the collection/environment id
    # variables nor the activation variable are passed to this job at all.
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'inventory'
    needs: validate
    runs-on: ubuntu-latest
    environment: postman
    steps:
      - name: Check out the dispatched ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: List collections and environments, one disposition each
        env:
          # The ONLY secret this job receives, and the only variable of any kind. There is no
          # POSTMAN_AUTOPUBLISH_ENABLED here: the inventory must work whatever its value is.
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: node .github/scripts/postman-inventory.mjs

  verify-only:
    name: Verify against Postman (read-only)
    # Deliberately NOT gated on POSTMAN_AUTOPUBLISH_ENABLED: inspecting the real targets while
    # publication is still disabled is the whole point of the activation sequence.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'verify'
    needs: validate
    runs-on: ubuntu-latest
    environment: postman
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Report NOOP/UPDATE without writing
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_COLLECTION_ID: ${{ vars.POSTMAN_COLLECTION_ID }}
          POSTMAN_PRODUCTION_ENVIRONMENT_ID: ${{ vars.POSTMAN_PRODUCTION_ENVIRONMENT_ID }}
          POSTMAN_SANDBOX_ENVIRONMENT_ID: ${{ vars.POSTMAN_SANDBOX_ENVIRONMENT_ID }}
          POSTMAN_AUTOPUBLISH_ENABLED: ${{ vars.POSTMAN_AUTOPUBLISH_ENABLED }}
        run: node .github/scripts/postman-sync.mjs --verify
