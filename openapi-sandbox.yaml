        required: true
        description: "Identical to the paid request contract — there is no sandbox-only request field and no `fixture` flag. The example below is the DOCUMENTED FIXTURE INPUT (fixture id `check-eth-735-v1`): sending it with a sandbox key returns the deterministic published payload, while any other address runs real bounded analysis. `network` is optional and auto-detected from the address format when omitted."
        content:
          application/json:
            schema:
              type: object
              required:
                - address
              properties:
                address:
                  type: string
                  description: Wallet or contract address
                  example: "0x0000000000000000000000000000000000735735"
                network:
                  type: string
