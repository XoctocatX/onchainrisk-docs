        confidenceLevel:
          type:
            - string
            - "null"
          enum:
            - high
            - medium
            - low
            - null
        attributionEvidenceType:
          type:
            - string
            - "null"
    DestinationEntitySummary:
      type: object
      description: Aggregate over detected destination entities.
      properties:
        assetTotals:
          type: array
          items:
            $ref: "#/components/schemas/DestinationEntityAssetTotal"
        totalDetected:
          type: integer
        recordsReturned:
          type: integer
        truncated:
          type: boolean
        historyDisclosure:
          oneOf:
            - $ref: "#/components/schemas/DestinationEntityHistoryDisclosure"
            - type: "null"
    ExchangeDepositsInvalidated:
      type: object
      description: M2-C2 sentinel written when a persisted report's historical exchange attribution can no longer be truthfully reconstructed from retained data. Carries no totalDeposits/totalValue/exchangeBreakdown/flags — the prior numeric attribution must not be retained as fact. Never produced by live analysis.
      required:
        - status
        - curation
      properties:
        status:
          type: string
          enum:
            - historical_attribution_invalidated
        curation:
          type: string
          minLength: 1
          example: M2-C2-2026-08-04
    ExchangeDepositsValid:
      type: object
      description: Valid exchange-deposit summary. Exchange-identity -> count only; untrusted token symbols are never part of the breakdown keys. Legacy valid objects omit `status`.
      required:
        - totalDeposits
        - totalValue
        - exchangeBreakdown
        - flags
      properties:
        totalDeposits:
          type: integer
          minimum: 0
        totalValue:
          type: string
        exchangeBreakdown:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        exchangeAssetBreakdown:
          type: array
          items:
            type: object
        flags:
          type: array
          items:
            type: string
    FlagDetail:
      type: object
      required:
        - code
        - templateKey
        - defaultEn
      description: |
        Localization-friendly flag metadata. Use `code` / `templateKey` for
        translation/mapping. `defaultEn` is a display fallback only — it
        may include dynamic values and is not stable across releases.
        Pattern flags use the `pattern.*` namespace; bot flags (under
        `timing.botFlagDetails`) use the `bot.*` namespace.
      properties:
        code:
          type: string
          description: Stable machine-readable identifier. Use this for translation/mapping.
          example: bulk_collection
        templateKey:
          type: string
          description: Namespaced i18n key. `pattern.<code>` for pattern flags, `bot.<code>` for bot flags.
          example: pattern.bulk_collection
        defaultEn:
          type: string
          description: Current English display fallback. May include dynamic values. Do not use as translation key.
          example: "BULK COLLECTION pattern: 24 inbound TXs in 600s"
        severity:
          type:
            - string
            - "null"
          enum:
            - critical
            - high
            - medium
            - low
            - null
          example: medium
        description:
          type:
            - string
            - "null"
          description: Short stable English explanation of the flag meaning.
          example: Many sources sent funds within a short window (bulk collection).
    GraphEdge:
      type: object
      description: |
        Aggregated edge between target and one counterparty. Each
        `(target, counterparty)` pair produces exactly one edge —
        all transactions in the same direction-dominant flow are
        summed. Direction is inferred: edge points from the side
        that contributed more native value.
      required:
        - from
        - to
        - value
        - valueWei
        - txCount
      properties:
        from:
          type: string
          description: Source address (target or counterparty depending on net flow direction).
        to:
          type: string
          description: Destination address.
        fromLabel:
          type:
            - string
            - "null"
          description: Label of the `from` address (counterparty label when the counterparty was the sender; otherwise `null`).
        toLabel:
          type:
            - string
            - "null"
          description: Label of the `to` address (counterparty label when the counterparty was the recipient; otherwise `null`).
        value:
          type: string
          description: Native value formatted with unit (e.g. `"1.5 ETH"`).
        valueWei:
          type: string
          description: |
            Native value in raw integer units (wei for EVM, sun for
            Tron, satoshi for BTC/LTC, lamports for SOL, etc.). String
            to preserve precision beyond JS Number range.
        txCount:
          type: integer
          minimum: 1
          description: Number of transactions aggregated into this edge.
        firstTx:
          type: integer
          description: |
            Unix timestamp (seconds) of the earliest transaction
            aggregated into this edge. May be `0` when the upstream
            analyzer was unable to determine — treat `0` as "unknown",
            not "epoch zero".
        lastTx:
          type: integer
          description: |
            Unix timestamp (seconds) of the latest transaction
            aggregated into this edge. Same `0`-as-unknown caveat as
            `firstTx`.
        tokenBreakdown:
          type: array
          description: |
            Per-token volume context for transactions on this edge.
            Common fields per item include `symbol` (string), `value`
            (string, formatted), and `txCount` (integer); additional
            per-network fields may be present. **Treat the item shape
            as open** — clients should defensively handle unknown
            properties and not assume a closed schema.
          items:
            type: object
    GraphNode:
      type: object
      description: |
        Counterparty node in the paid graph response. One node per
        unique counterparty address aggregated from the target's
        transaction history.
      required:
        - address
        - txCount
      properties:
        address:
          type: string
          description: Counterparty address (case preserved per network — hex addresses returned in lowercase).
        label:
          type:
            - string
            - "null"
          description: |
            Human-readable label from the OnChainRisk label database
            (exchange names, mixer/bridge tags, custom user labels, etc.)
            or `null` when no label matches.
        isTarget:
          type: boolean
          description: |
            Always `false` for counterparty nodes returned by this
            endpoint. Reserved for graph-rendering clients that may
            also represent the queried address as a node — the API
            does not currently emit a target node, but client code
            should treat unknown values defensively.
        totalValue:
          type: string
          description: |
            Aggregate native value across all transactions with this
            counterparty, formatted with the network's native unit
            (e.g. `"1.5 ETH"`, `"42 BNB"`, `"100 TRX"`). String to
            preserve precision across networks.
        txCount:
          type: integer
          minimum: 0
          description: Total transactions between target and this counterparty in the fetched history.
        tokens:
          type: array
          description: |
            Token symbols flowing through this counterparty (capped at
            the top-N by volume per the analyzer). May be empty when
            no token transfers were observed or the network has no
            token analyzer wired.
          items:
            type: string
    Honeypot:
      type: object
      required:
        - status
      description: |
        Honeypot verification result on `POST /api/v1/token/check` (and
        the streaming variant). The `status` field indicates whether the
        verification was actionable. **Read `status` BEFORE relying on
        any measurable field.**

        `isHoneypot` is `null` for all non-ok statuses. Treating
        `isHoneypot === null` as `false` ("not a honeypot") is incorrect;
        null means "unknown".

        Saving a non-ok result via `POST /api/v1/token/reports` is **not
        charged** — see the cost summary at the top of this spec and the
        CHANGELOG entry for `honeypot.status`.

        Reason codes (when `status != "ok"`):
        - `provider_rate_limited` — upstream provider rate-limited the
          honeypot detector.
        - `provider_error` — upstream provider error (network, timeout,
          5xx, etc.).
        - `analyzer_error` — internal analyzer exception.
        - `network_not_supported` — detector is unavailable for this
          network/setup.
        - `no_data` — no on-chain DEX pair found or token contract
          inconclusive.
      properties:
        status:
          type: string
          enum:
            - ok
            - unable_to_verify
            - not_supported
            - no_data
        reason:
          type:
            - string
            - "null"
          enum:
            - provider_rate_limited
            - provider_error
            - analyzer_error
            - network_not_supported
            - no_data
            - null
        isHoneypot:
          type:
            - boolean
            - "null"
          description: |
            True/false ONLY when `status="ok"`. Null for all non-ok statuses.
            Null means "unknown" — NOT "not a honeypot".
        buyTax:
          type:
            - number
            - "null"
        sellTax:
          type:
            - number
            - "null"
        buySuccess:
          type:
            - boolean
            - "null"
        sellSuccess:
          type:
            - boolean
            - "null"
        transferPausable:
          type:
            - boolean
            - "null"
        hasBlacklist:
          type:
            - boolean
            - "null"
        hasMaxTx:
          type:
            - boolean
            - "null"
        hasCooldown:
          type:
            - boolean
            - "null"
        liquidityLocked:
          type:
            - boolean
            - "null"
        liquidityAmount:
          type:
            - number
            - "null"
        pairAddress:
          type:
            - string
            - "null"
        dexName:
          type:
            - string
            - "null"
        flags:
          type:
            - array
            - "null"
          items:
            type: string
        riskLevel:
          type:
            - string
            - "null"
    InvestigationArchivedResponse:
