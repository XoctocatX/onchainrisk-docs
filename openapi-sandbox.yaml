          description: True when the contract is a proxy (EIP-1967 / minimal proxy / etc.) verified against on-chain implementation slot. Inferred-only fallbacks are NOT reflected here.
        implementationAddress:
          type:
            - string
            - "null"
          description: Set when `isProxy` is true and the implementation is resolvable.
        contractName:
          type:
            - string
            - "null"
    CounterpartyLabel:
      type: object
      description: |
        R2. The PUBLIC egress shape of `counterpartyLabel`, which is an OBJECT, not a string.
        `web/api/main.py` assigns `label_db.lookup(...)` directly —
        `LabelDatabase.lookup() -> Optional[LabelEntry]` (ethforensics/labels/loader.py:1356)
        — with no `.label` extraction and no `asdict`. Unlike `topCounterparties[].label`,
        `clusters[].members[].label`, top-level `labels` and `fundedBy.label`, which the Worker
        passes through `normalizeLabel()`, `counterpartyLabel` is touched NOWHERE in the Worker:
        both the sync path (routes/check.js) and the async path (consumer.js) forward
        `transaction_history` / `token_transfer_history` verbatim. So the dataclass reaches
        paying customers as an object.

        Documented, deliberately NOT fixed. Normalising it would change an existing paid
        response type for the 2 live paid integrations, which #735's standing rule forbids —
        sandbox adapts to paid, not paid to sandbox. Slice 1 records current truth even where
        current truth is ugly; any normalisation is a separate compatibility/versioning
        decision. `/api/analyze` declares no `response_model` and no `exclude_none`, so all five
        dataclass fields serialise, including `custom_label: null`.

        No `required` list: the keys are guaranteed only by dataclass serialisation on this one
        path and nothing pins that, so adding a `response_model` or `exclude_none` upstream
        would silently break a `required` promise made here.
      properties:
        address:
          type: string
        label:
          type: string
        category:
          type: string
        source:
          type: string
          description: Dataclass default is "manual".
        custom_label:
          type:
            - string
            - "null"
          description: "`Optional[str] = None` — a preserved user note on a protected high-risk record; null for every other record. Snake_case because the dataclass field name is serialised as-is."
    Coverage:
      type: object
      description: |
        Per-chain coverage disclosure block. Present on every report response
        regardless of stage — clients should NEVER need to special-case its absence.

        Stage taxonomy:
          - `ga`       — General Availability: full historical depth within stated window.
          - `rollout`  — Active migration / soak window. Coverage windows may temporarily vary.
          - `preview`  — Pre-v1: reports may have incomplete depth or gaps.
          - `degraded` — Known operational incident; see `warning` and `incident_url`.

        **Client integration requirement:** clients integrating OnChainRisk are
        REQUIRED to surface the `coverage.disclosure` field to end users when
        `stage != ga`. For `stage in [preview, degraded]`, clients MUST surface
        the `warning` field prominently.

        Canonical per-chain status matrix: see the `matrix_url` link.
      required:
        - stage
        - window
        - data_path
        - as_of
        - disclosure
        - matrix_url
      properties:
        stage:
          type: string
          enum:
            - ga
            - rollout
            - preview
            - degraded
          description: |
            Coverage maturity for this chain.
        window:
          type:
            - string
            - "null"
          example: 30d
          description: |
            Trailing coverage window (e.g. "30d", "90d"). May be `null` for
            chains in `preview` stage where no window is yet committed.
        data_path:
          type: string
          example: self_hosted_nitro_clickhouse
          description: |
            Production data path label (informational; not a user-facing
            commitment). Subject to change without notice within the stated stage.
        as_of:
          type: string
          format: date
          example: "2026-05-04"
          description: ISO date when this coverage status was last verified.
        disclosure:
          type: string
          description: |
            Disclosure text appropriate for this stage. Clients SHOULD surface
            this to end users when `stage != ga`. For `ga` chains, this is the
            standard methodology footer reference.
        warning:
          type: string
          description: |
            Strong warning text. Present (REQUIRED) when `stage in [preview, degraded]`.
            Clients MUST surface this prominently. Absent for `stage in [ga, rollout]`.
        incident_url:
          type: string
          format: uri
          description: |
            Incident status URL. May be present when `stage = degraded`.
        matrix_url:
          type: string
          format: uri
          example: https://onchainrisk.io/coverage
          description: |
            Public canonical coverage matrix page. UI pills and clients
            integrating OnChainRisk should link here for current per-chain status.
        served_from:
          type: string
          enum:
            - hot
            - archive
            - direct_node
            - direct_api
            - mixed
          description: |
            Optional hybrid read-model disclosure. Which read path served this
            report: `hot` (own indexer / hot store), `archive` (replayed from
            archive), `direct_node` (point node lookup), `direct_api`
            (third-party API fallback, e.g. Moralis), or `mixed` (hot/indexer
            data combined with a point lookup such as `eth_getCode` is_contract).
            Absent when the producer does not yet emit hybrid disclosure.
        historical_completeness:
          type: string
          enum:
            - within_window
            - replayed_from_archive
            - partial_via_fallback
            - unknown_before_window
          description: |
            Optional hybrid read-model disclosure. Depth completeness of the
            served data: `within_window` (full depth within the stated window),
            `replayed_from_archive` (archive replay restored depth),
            `partial_via_fallback` (a third-party fallback supplied partial
            depth), or `unknown_before_window` (the indexer window limited how
            far back depth is known). Absent when not emitted by the producer.
        fallback_used:
          type: boolean
          description: |
            Optional hybrid read-model disclosure. `true` when a third-party /
            direct-API fallback (e.g. Moralis) supplied the analytical data.
            A point lookup such as `eth_getCode` / is_contract alone does NOT
            set this. Absent when not emitted by the producer.
        source_mode:
          type: string
          description: |
            Optional hybrid read-model disclosure. Free-form source label, e.g.
            `mixed` (hot indexer + point lookup), `hot:<data_path>`, or
            `fallback:moralis`. Informational; not an enum. Absent when not
            emitted by the producer.
        coverage_window:
          type:
            - string
            - "null"
          example: 30d
          description: |
            Optional alias of `window` — same value, provided for hybrid
            read-model consumers that key on `coverage_window`. Does NOT change
            the meaning of `window`. Absent when not emitted by the producer.
      example:
        stage: rollout
        window: 30d
        data_path: self_hosted_nitro_clickhouse
        as_of: "2026-05-04"
        disclosure: OnChainRisk's multi-chain coverage is in active rollout...
        matrix_url: https://onchainrisk.io/coverage
        served_from: hot
        historical_completeness: within_window
        fallback_used: false
        source_mode: hot:self_hosted_nitro_clickhouse
        coverage_window: 30d
    CustomLabelRow:
