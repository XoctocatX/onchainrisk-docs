    InvestigationResponse:
      type: object
      description: |
        One investigation with its conversation. The payload is the stored row (snake_case)
        plus a parsed `messages` array.

        **History can be withheld without failing the read.** When the caller's CURRENT access
        to the linked report is only PREVIEW, `messages` comes back EMPTY with
        `history_unavailable: true` and a `history_reason` — a 200, not an error. Absence of
        those two keys means the history is complete.
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          required:
            - investigation
          properties:
            investigation:
              type: object
              required:
                - id
                - status
                - messages
              properties:
                id:
                  type: integer
                user_id:
                  type: integer
                title:
                  type:
                    - string
                    - "null"
                status:
                  type: string
                  enum:
                    - active
                    - limit_reached
                    - archived
                message_count:
                  type:
                    - integer
                    - "null"
                tool_calls_count:
                  type:
                    - integer
                    - "null"
                tokens_used:
                  type:
                    - integer
                    - "null"
                report_id:
                  type:
                    - string
                    - "null"
                report_type:
                  type:
                    - string
                    - "null"
                created_at:
                  type: integer
                updated_at:
                  type: integer
                messages:
                  type: array
                  description: |
                    The stored conversation, parsed from JSON (`[]` when absent). Message
                    objects are the agent transcript as written and are deliberately not
                    constrained here.
                  items:
                    type: object
                    additionalProperties: true
                history_unavailable:
                  type: boolean
                  description: Present and `true` only when history was withheld; otherwise absent.
                history_reason:
                  type: string
                  description: Present only alongside `history_unavailable`.
