openapi: 3.1.0
info:
  title: OnChainRisk Sandbox API
  version: 1.0.0
  license:
    name: Proprietary
    url: https://onchainrisk.io/terms
  description: |
    **[⬇ Download OpenAPI spec (YAML)](/openapi-sandbox.yaml)** — for codegen tools (openapi-generator, orval, etc.)

    ---

    Sandbox tier for developers to evaluate OnChainRisk integration with real
    addresses and real responses, without the compute cost of a full paid
    analysis.

    ## What Sandbox is for

    - Auth testing - confirm your API key works
    - Response envelope validation - see actual field types and shapes
    - Integration testing - wire your client against a real endpoint
    - Basic UI prototyping

    ## What Sandbox is NOT for

    - Production monitoring or alerting bots
    - Large-scale tracing or attribution
    - Any workflow that depends on live historical data beyond 7 days
      (bounded execution is windowed; fixture execution is synthetic, not history)
    - Graph expansion, cluster analysis, cross-chain tracing

    ## Authentication

    Create a sandbox API key in the dashboard at
    https://app.onchainrisk.io/dashboard/api-keys. Free-tier accounts can create
    a sandbox key. Key management (create, list, revoke) is dashboard-only
    and intentionally not exposed here.

    Send your key in the `Authorization` header:

        Authorization: Bearer ocr_test_...

    New sandbox keys minted by the dashboard use the `ocr_test_*` prefix.
    Sandbox keys created before the prefix split remain valid and may
    appear with the legacy `ocr_live_*` prefix; either form authenticates
    as a sandbox key based on the underlying key tier.

    ## Rate Limits

    Token bucket algorithm.

    | Scope   | Capacity | Refill       |
    |---------|----------|--------------|
    | Per key | 20       | 10 per min   |
    | Per IP  | 30       | 30 per min   |

    429 responses include a `Retry-After` header and a body with `bucket`
    and `retry_after_seconds`.

    ## POST /api/v1/check execution modes

    Every successful sandbox response from `POST /api/v1/check` states how it
    was produced, in `_sandbox.execution_mode`:

    - `bounded` - real analysis, deliberately narrowed. Every arbitrary address
      you send is bounded.
    - `fixture` - the deterministic published payload for a DOCUMENTED FIXTURE
      INPUT. Synthetic and fixed: not live data, not windowed, and it does not
      expire. See the `POST /api/v1/check` example for the one documented
      fixture input today.

    SCOPE. `execution_mode` and `fixture_fields` belong to the
    `POST /api/v1/check` marker only. `POST /api/v1/sandbox/graph/expand`
    returns its own `_sandbox` block, with its own keys (`partial`, `limits`,
    and its own `gated_fields`) and NEITHER of those two; it has no documented
    fixture input. `GET /api/v1/usage` and every error response carry no
    `_sandbox` marker of this shape at all. Read each operation's own schema.

    Read `_sandbox.execution_mode` before reading anything below. The
    field-level policy that follows describes BOUNDED execution of
    `POST /api/v1/check`; a documented fixture deliberately departs from it for
    the fields it lists in `_sandbox.fixture_fields`.

    ## Response Policy (POST /api/v1/check)

    This section describes the `POST /api/v1/check` response only; the graph
    preview and quota operations have their own schemas.

    Check responses keep the same core envelope as paid (`address`,
    `network`, `riskScore`, `riskLevel`, `addressInfo`, `_sandbox`, etc.),
    but on BOUNDED execution many expensive fields are gated:

    - gated objects are returned as `null` on bounded execution
      (e.g. `tokenFlow`, `clusters`, `honeypot`)
    - gated arrays are returned as `[]` on bounded execution
      (e.g. `topCounterparties`, `addressConnections`)
    - gated scalars are omitted entirely, in every mode
      (e.g. `analysisMode`, `fullAnalysisAvailable`)
    - truncated arrays keep only recent items on bounded execution
      (e.g. `transactionHistory` is windowed to the last 7 days)

    On FIXTURE execution the fields named in `_sandbox.fixture_fields` carry the
    published fixture payload instead - a gated array can be non-empty, a gated
    object can be non-null, and fixture history is NOT 7-day-windowed live data.
    Each such field is listed in `fixture_fields` and is absent from
    `gated_fields` / `truncated_fields`, so the two never contradict each other.

    The authoritative lists for a GIVEN check response live in
    `_sandbox.gated_fields[]`, `_sandbox.truncated_fields{}` and
    `_sandbox.fixture_fields[]`. Clients should treat these as source of truth,
    NOT assume every paid field will be present, and never hard-code the
    examples above.

    ## Sandbox signal (canonical)

    A client can detect sandbox mode two ways:

    1. Response contains a `_sandbox` root object with `profile: "sandbox"`
    2. `GET /api/v1/usage` returns `key_type: "sandbox"`

    No other field is overloaded with sandbox semantics: nothing encodes sandbox
    provenance inside a business field, and `plan`, `riskLevel`, `riskConfidence`
    and `dataQuality` are ordinary business values.

    Those enums are generated from the paid vocabulary, WIDENED with the members
    this sandbox surface has already published - `riskLevel` also admits
    `unknown`, and `dataQuality` also admits `degraded`. They are supersets of
    the paid vocabularies, not exact copies: a value you can receive here may not
    be in the paid enum, so do not treat sandbox enum membership as proof of paid
    enum membership. The reverse direction is what the sandbox guarantees - every
    paid value is accepted here.

    ## Validation errors

    Address validation runs before any blockchain scan. On failure the API
    returns **HTTP 422** with this envelope:

    ```json
    {
      "success": false,
      "error": {
        "message": "Validation failed",
        "code": "VALIDATION_ERROR",
        "details": {
          "address": "Address format does not match selected network. The address looks like a tron address, but network was set to eth.",
          "errorCode": "ADDRESS_NETWORK_MISMATCH",
          "detectedFamily": "tron",
          "requestedNetwork": "eth"
        }
      }
    }
    ```

    `error.code` is always `VALIDATION_ERROR` for this class. The granular
    reason lives in `error.details.errorCode`:

    | `errorCode`                   | When                                                                             |
    |-------------------------------|----------------------------------------------------------------------------------|
    | `INVALID_ADDRESS`             | empty, wrong format, whitespace-only                                             |
    | `UNSUPPORTED_NETWORK`         | `network` not in the supported list                                              |
    | `COULD_NOT_DETECT_NETWORK`    | address format unrecognised AND `network` omitted                                |
    | `INVALID_ADDRESS_CHECKSUM`    | decode succeeded, family checksum failed (Tron / BTC-legacy / LTC-legacy). Solana decode failures surface as `INVALID_ADDRESS` because Solana is not checksum-based. |
    | `ADDRESS_NETWORK_MISMATCH`    | detected address family inconsistent with requested `network`                    |

    `detectedFamily` and `requestedNetwork` are present only when they add
    useful diagnostic context; both may be `null` or absent.
  contact:
    name: OnChainRisk Support
    url: https://app.onchainrisk.io/dashboard/support
    email: admin@onchainrisk.io

servers:
  - url: https://api.onchainrisk.io
    description: Production (sandbox requests use the same host)

tags:
  - name: Analysis
    description: Address risk analysis (sandbox profile)
  - name: Graph
    description: |
      Transaction graph preview (sandbox profile). Limited to depth 1,
      last 7 days, capped nodes/edges. Upgrade for full historical graph
      expansion via paid `/api/graph/expand`.
  - name: Account
    description: Quota and rate-limit introspection for the authenticated key

security:
  - ApiKeyAuth: []

paths:
  /api/v1/check:
    post:
      tags: [Analysis]
      summary: Analyze a wallet address (sandbox profile)
      description: |
        Returns a risk summary for the given address. What runs depends on the
        input, and the response says which in `_sandbox.execution_mode`:

        - **`bounded`** - every arbitrary address. The sandbox profile runs only
          cheap modules on the backend: label lookup, balance + tx count,
          contract bytecode check, and recent activity in a 7-day window.
          Expensive modules (token flow, cross-chain, clustering, graph) are
          skipped at compute time and the corresponding response fields are
          gated per the policy in the top-level description.
        - **`fixture`** - the DOCUMENTED FIXTURE INPUT shown in the example
          below. No analysis modules run at all and no provider is called; the
          response is the deterministic published payload, so the fields listed
          in `_sandbox.fixture_fields` carry fixed synthetic data rather than
          gated placeholders. It is there so you can exercise your response
          parsers against paid-shaped structures before you hold a paid key.

        The request contract is identical to paid - there is no `fixture` flag
        and no sandbox-only request field. The fixture is selected by its
        documented address, and only for an authenticated sandbox key: the same
        address on a paid key runs ordinary paid analysis.
      # <<< GENERATED:check-operation — do not edit by hand; see scripts/generate-sandbox-contract.mjs >>>
