    TokenTransfer:
      type: object
      description: |
        Token transfer entry. Serializer: `token_tx_history.append({...})` in web/api/main.py
        (most recent 50). `tokenSymbol` / `tokenName` are non-Optional on the TokenTransfer
        dataclass, so they are strings rather than nullable.
      properties:
        hash:
          type: string
        timestamp:
          type: integer
          description: Unix seconds.
        direction:
          type: string
          enum:
            - in
            - out
        counterparty:
          type: string
        counterpartyLabel:
          oneOf:
            - $ref: "#/components/schemas/CounterpartyLabel"
            - type: "null"
          description: Same raw `LabelEntry` object as on Transaction, or null.
        tokenSymbol:
          type: string
        tokenName:
          type: string
        value:
          type: string
          description: "`str(t.value_formatted)` — decimal string, not the raw base-unit amount."
    Transaction:
      type: object
      description: |
        Native transaction entry. Serializer: `tx_history.append({...})` in web/api/main.py —
        two branches, a UTXO branch and the EVM/account branch, which share the first ten
        properties. The `utxo*` / `feeSats` / `balanceDeltaSats` properties are emitted ONLY
        by the UTXO branch, so they are absent on other networks rather than null.
      properties:
        hash:
          type: string
        timestamp:
          type: integer
          description: Unix seconds.
        direction:
          type: string
          enum:
            - in
            - out
            - self
            - mixed
        counterparty:
          type: string
          description: May be the empty string when no single counterparty is attributable (UTXO MIXED).
        counterpartyLabel:
          oneOf:
            - $ref: "#/components/schemas/CounterpartyLabel"
            - type: "null"
          description: Raw `LabelEntry` object from `label_db.lookup(...)`, or null when the counterparty is unlabelled or no label DB is loaded. NOT a string — see CounterpartyLabel.
        value:
          type:
            - string
            - "null"
          description: Formatted amount. NULL on a UTXO row whose transfer value is not attributable (`format_value(_transfer) if _transfer is not None else None`).
        valueWei:
          type:
            - string
            - "null"
          description: Base-unit amount as a decimal string. Null in the same non-attributable UTXO case.
        isError:
          type: boolean
        methodId:
          type: string
          description: "`t.method_id or ''` — empty string rather than null; always '' on UTXO rows."
        functionName:
          type: string
          description: "`t.function_name or ''` — empty string rather than null; always '' on UTXO rows."
        utxoFlowKind:
          type: string
          enum:
            - OUTGOING
            - INCOMING
            - COINBASE
            - SELF
            - MIXED
          description: UTXO rows only. Raw `flow_kind` before the direction mapping.
        utxoValueBasis:
          type: string
          enum:
            - exact_transfer
            - received
            - coinbase
            - self_zero
            - not_attributable
          description: UTXO rows only. How `value` was derived, or that it could not be.
        utxoAttributionExact:
          type: boolean
          description: UTXO rows only. `outbound_attribution_exact or inbound_source_attribution_exact`; both default False, so never null.
        utxoExternalOutputCount:
          type: integer
          description: UTXO rows only.
        feeSats:
          type: string
          description: UTXO rows only. Decimal string.
        balanceDeltaSats:
          type: string
          description: UTXO rows only. Decimal string; the subject's net balance change.
