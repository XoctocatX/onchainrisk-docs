                      outcome:
                        type: string
                        enum:
                          - complete
                          - empty_terminal
                          - partial
                        description: |
                          Result classification for a successful (200) expansion:
                          `complete` (usable, full history), `empty_terminal` (the
                          provider reliably established there are no additional
                          connections), or `partial` (usable but incomplete).
                          A degraded/failed acquisition is NOT returned as 200 — it
                          surfaces as `503 EXPAND_UNAVAILABLE` (retryable). Optional
                          and additive; absent on older responses.
                      partial:
                        type: boolean
                        description: |
                          True when upstream tx fetch hit a per-network cap.
                          Absent when the full history was scanned.
                      fetchedTxs:
                        type: integer
                        description: Transactions actually fetched from the upstream provider. Present only when `partial = true`.
