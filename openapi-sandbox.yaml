            - "null"
          description: |
            Caller-assigned report name. Emitted by `GET /api/reports/{id}` only
            (`row.name || null`); the fresh-scan responses do not carry it.
    AsyncQueuedResponse:
      type: object
      description: |
        202 response from POST /api/v1/check when the analysis takes the async
        path (heavy address). The reportId is stable across the in-flight window —
        a deduplicated retry returns the same id with `deduplicated: true`.

        A FRESH acceptance always reports `queued` and omits `deduplicated`
        entirely. A DEDUPLICATED retry reports the existing lifecycle's current
        status, which is `queued` or `analyzing` — never a terminal status,
        because a `complete` or `failed` report is not a dedupe candidate.
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required:
            - reportId
            - status
            - async
          properties:
            reportId:
              type: string
              format: uuid
              description: Public id of the queued report. Use with /api/v1/check/status/{reportId}.
            status:
              type: string
              enum:
                - queued
                - analyzing
              description: |
                `queued` on a fresh acceptance — always, since a new lifecycle
                is zero seconds old. On a deduplicated retry this is the
                EXISTING lifecycle's current status, so it may be `analyzing`.

                Terminal statuses never appear here: only an in-flight
                lifecycle deduplicates, so `complete` and `failed` are
                unreachable on this response. Read
                `GET /api/v1/check/status/{reportId}` for the full
                `ReportStatus` vocabulary.
            async:
              type: boolean
              enum:
                - true
              description: Discriminator. Always true on this response.
            deduplicated:
              type: boolean
              description: |
                Present and `true` ONLY when this 202 returned an existing
                in-flight lifecycle's id instead of creating a new one. Absent
                entirely on a fresh acceptance — do not treat `false` and
                missing as different.

                Within a 30-minute window, a repeat POST for the same
                `(owning account, canonical address, network)` is idempotent
                and creates no new charge and no new queue job — provided the
                existing lifecycle is still in flight. Ownership is the
                ACCOUNT, so another key on the same account deduplicates
                against it too.
