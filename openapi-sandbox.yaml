    AnalysisResponse:
      type: object
      description: |-
        The REAL HTTP body of `POST /api/v1/check` on the sandbox surface.

        The HTTP 200 response for this endpoint uses the standard `{ success, data }` envelope — `handleSandboxCheck` serializes exactly `{ success: true, data: <payload> }`. THE TOP LEVEL IS IDENTICAL TO PAID: same `success` flag, same `data` key, same requiredness, same component name. Only what `data` points at differs — `SandboxCheckResponse` rather than the paid `AnalysisResult` — and that is where field gating and `_sandbox` live.

        The async path returns 202 with `AsyncQueuedResponse`: the same envelope, a different payload.

        Derived from the paid envelope component by the generator — see web/api/scripts/generate-sandbox-contract.mjs.
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: "#/components/schemas/SandboxCheckResponse"
    SandboxCheckResponse:
      type: object
      description: |-
        Sandbox response for `POST /api/v1/check`.

        SHARED FIELDS ARE PAID-COMPATIBLE. Every property described below is derived from the paid `AnalysisResult`. Shared fields preserve paid-compatible types and nullability, and their enums ACCEPT EVERY PAID VALUE — so a parser written against the shared-field contract here accepts the paid values for those same fields. The relation is directional, not identity: two already-published sandbox enums are intentional SUPERSETS, `riskLevel` additionally admitting `unknown` and `dataQuality` additionally admitting `degraded`, so sandbox enum membership is not proof of paid enum membership. What else differs is the VALUES: the sandbox withholds or narrows data per field, and `_sandbox` states exactly what it did for the response you are holding.

        FIELDS THE SANDBOX NEVER SENDS ARE STILL DECLARED. The sandbox withholds 24 fields the paid response may carry (SANDBOX_FIELD_POLICY.omitted). Each of them that exists in the paid contract is published here anyway — OPTIONAL and marked `x-sandbox-omitted: true` — so a client generated from this document already models the paid field surface and the credential swap exposes nothing your models lack. They are declared, not promised: sandbox execution does not emit them, so never block on one with an `ocr_test_*` key. Do not configure a generated client to reject unknown properties regardless.

        Read `_sandbox` first. `execution_mode` says whether the response is bounded real analysis or a documented fixture, and `gated_fields` / `truncated_fields` / `fixture_fields` are the per-response authority on every field below.

        Generated from the paid contract and the runtime sandbox policy — see web/api/scripts/generate-sandbox-contract.mjs.
      properties:
        address:
          type: string
          description: Real value computed by the sandbox profile. `_sandbox.gated_fields` and `_sandbox.truncated_fields` are the per-RESPONSE authority — read them rather than hard-coding this description.
        network:
          type: string
          description: Real value computed by the sandbox profile. `_sandbox.gated_fields` and `_sandbox.truncated_fields` are the per-RESPONSE authority — read them rather than hard-coding this description.
        riskScore:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 100
          description: |-
            Null while async scan is queued/analyzing.

            Real value computed by the sandbox profile. `_sandbox.gated_fields` and `_sandbox.truncated_fields` are the per-RESPONSE authority — read them rather than hard-coding this description.
        riskLevel:
          type:
            - string
            - "null"
          enum:
            - critical
            - high
            - medium
            - low
            - null
            - unknown
          description: Real value computed by the sandbox profile. `_sandbox.gated_fields` and `_sandbox.truncated_fields` are the per-RESPONSE authority — read them rather than hard-coding this description.
        riskContributions:
          type:
            - object
            - "null"
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 100
          description: |-
            Per-component risk contribution scores, 0-100. Keys are the
            seven scorer components (mixer_interaction, sanctioned_contact,
            behavioral_patterns, counterparty_risk, timing_anomalies,
            contract_risk, fund_flow_topology). Null on pre-explainability
            Modal versions. Honest invariant:
              base_score ≈ round(Σ riskContributions[k] × riskWeights[k])
            The final `riskScore` may still be higher than base_score
            because critical override floors (sanctioned, exploit, frozen,
            mixer, transit_massive, ...) are applied separately. Surfacing
            which floor fired is planned for a future PR.

            NOT SENT BY THE SANDBOX. This field is part of the paid response contract and is declared here (optional, `x-sandbox-omitted: true`) so a client generated from this document models the paid field surface, but sandbox execution never emits it — `applySandboxFieldPolicy` drops it (SANDBOX_FIELD_POLICY.omitted). Do not wait for it on an `ocr_test_*` key; do handle it on `ocr_live_*`.
          x-sandbox-omitted: true
        riskWeights:
          type:
            - object
            - "null"
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
          description: |-
            Effective per-component weights actually used for THIS scoring
            run, after custom_weights validation/normalization and EOA
            redistribution. NOT the static module-default weights.

            **EOA redistribution rule:** when the analyzed target is an
            externally-owned account (EOA), the `contract_risk` weight is
            zeroed and its share is proportionally redistributed across
            `mixer_interaction`, `sanctioned_contact`, and
            `behavioral_patterns`. A user who PATCHed their saved
            `custom_weights` with e.g. `contract_risk: 0.20` will therefore
            see `riskWeights.contract_risk: 0` on an EOA target — the
            value was applied, then redistributed by the scorer. This
            transformation is intentional and only affects EOA targets;
            contract targets see weights as PATCHed. (F-R — #52.2 docs
            hardening.)

            Sum of values is 1.0 (within float tolerance). Keys are the
            same seven components as `riskContributions` so the two maps
            can be zipped client-side. Null on pre-explainability Modal
            versions.

