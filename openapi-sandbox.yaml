          type: boolean
        hasDelegatecall:
          type: boolean
        hasCreate2:
          type: boolean
        similarityFlags:
          type: array
          items:
            type: string
          description: Pattern matches against known exploit fingerprints. Empty array when none.
        knownSignatures:
          type: array
          items:
            type: string
          description: Decoded function signatures recognized in bytecode. Empty array when none.
    ContractDeployment:
      type: object
      description: |
        Contract deployed by the address. Serializer: `deployments_data.append({...})` in
        web/api/main.py. Note `timestamp` here is an ISO-8601 STRING
        (`datetime.fromtimestamp(...).isoformat()`), unlike the integer timestamps on
        Transaction / TokenTransfer.
      properties:
        txHash:
          type: string
        timestamp:
          type: string
          format: date-time
        contractAddress:
          type: string
        contractName:
