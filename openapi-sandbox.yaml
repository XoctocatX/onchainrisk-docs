    NotificationSettingsRowResponse:
      type: object
      description: |
        `PATCH` answers with the STORED ROW wrapped in `settings` — a different shape from
        `GET /api/notifications/settings`, which answers a flat camelCase projection. The two
        are not interchangeable, and that asymmetry is recorded here rather than normalised.

        **`webhook_secret` is NOT part of this contract.** It is a value YOU supply in the
        request body; nothing in the API is specified to return it, `GET
        /api/notifications/settings` does not, and no client should read it back from here.
        Treat your own copy as the authority.
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          required:
            - settings
          properties:
            settings:
              type: object
              additionalProperties: true
              properties:
                id:
                  type: integer
                user_id:
                  type: integer
                telegram_chat_id:
                  type:
                    - string
                    - "null"
                telegram_enabled:
                  type:
                    - integer
                    - "null"
                webhook_url:
                  type:
                    - string
                    - "null"
                webhook_enabled:
                  type:
                    - integer
                    - "null"
                email_enabled:
                  type:
                    - integer
                    - "null"
                daily_digest:
                  type:
                    - integer
                    - "null"
                created_at:
                  type: integer
                updated_at:
                  type:
                    - integer
                    - "null"
    OkFlagResponse:
      type: object
      description: |
        Bare acknowledgement: `DELETE /api/watchlist/{id}`, `DELETE /api/labels/{id}` and
        `POST /api/notifications/telegram/disconnect` all answer `{ "success": true, "data":
        { "success": true } }`. The inner `success` is the handler's own payload
        (`json({ success: true })`) and is NOT the envelope flag — reading `data.success`
        rather than the envelope is what a client should do here.
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          required:
            - success
          properties:
            success:
              type: boolean
              enum:
                - true
    ReportAccess:
      type: object
      description: |
        Customer-facing READ-access DTO for the analysis artifact
        (`utils/report-egress-access.js::buildAccessDTO`). Egress metadata only — it is
        never persisted into the report and never appears inside the preview projection.

        `state` says what the caller is entitled to SEE:
          - `FULL`               — monetization inactive / grandfathered, or a request-time
                                   full-capability override. Not purchasable.
          - `PERMANENT_OWNED`    — a durable unlock exists for this artifact.
          - `SUBSCRIPTION_FULL`  — full access for the life of the current subscription.
          - `PREVIEW`            — no entitlement; the body is the preview projection.

        `temporarilyUnavailable: true` marks a FAIL-CLOSED preview (an entitlement or
        subscription lookup error), which is NOT the same as a genuine no-entitlement
        preview: the former is never purchasable.
      required:
        - state
        - unlockable
      properties:
        state:
          type: string
          enum:
            - FULL
            - PERMANENT_OWNED
            - SUBSCRIPTION_FULL
            - PREVIEW
        unlockable:
          type: boolean
          description: |
            `true` only for a genuine no-entitlement PREVIEW over a persisted, deliverable
            artifact. An unpersisted fresh re-scan is never unlockable — there is no durable
            row for `POST /api/billing/artifact-unlock` to target.
        temporarilyUnavailable:
          type: boolean
          description: Present and `true` only on a fail-closed preview.
        unlockBasePriceDisplay:
          type: string
          description: |
            Presentation-only base price, present only when `unlockable` is `true`.
            Settlement is by invoice; never treat this as the charged amount.
        unlockCurrency:
          type: string
          enum:
            - USDT
          description: Present only when `unlockBasePriceDisplay` is.
    ReportExport:
      type: object
      description: |
        EXPORT capability for this artifact (`utils/export-authority.js::buildExportDTO`) — a
        separate capability from read access, clamped upstream so the two can never contradict
        each other within one response (a PREVIEW read never reports full export).
      required:
        - full
      properties:
        full:
          type: boolean
          description: Whether the caller may export the full artifact.
        temporarilyUnavailable:
          type: boolean
          description: Present and `true` when the export authority could not be resolved (fail-closed).
    ReportResponse:
      type: object
      description: |
        The REAL HTTP body of GET /api/reports/{id} — the same `{ success, data }` envelope.

        `data` is EITHER a complete `AnalysisResult` OR the lightweight body returned for every
        non-complete status (`failed` included).

        **anyOf, not oneOf, and that is deliberate.** The two branches are not distinguishable by
        schema: `AnalysisResult` has no required properties, and the lightweight body's six
        properties all exist on it as optionals — so a lightweight payload satisfies BOTH branches
        and a strict `oneOf` validator rejects a response the API genuinely sends. The route has
        no discriminator field to add without changing paid runtime, so the honest composition is
        `anyOf`.

        **Branch on whether `data.status` is PRESENT**, not on its value:

        * `data.status` **absent** → the complete `AnalysisResult`. A complete report carries
          no `status` field at all.
        * `data.status` **present and not `complete`** → the lightweight body (`queued`,
          `analyzing` or `failed`).

        Testing `data.status === 'complete'` never matches, because the complete branch omits
        the field entirely. The server's own `if (row.status && row.status !== 'complete')`
        tests the STORED ROW, not the response payload, and must not be transcribed as a
        client rule.
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          anyOf:
            - $ref: "#/components/schemas/AnalysisResult"
            - type: object
              description: |
                Non-complete report — analysis not written. Returned for `queued`, `analyzing`
                AND `failed`; on `failed`, `errorMessage` is populated.
              required:
                - reportId
                - status
              properties:
                reportId:
                  type: string
                address:
                  type: string
                network:
                  type: string
                status:
                  $ref: "#/components/schemas/ReportStatus"
                errorMessage:
                  type:
                    - string
                    - "null"
                createdAt:
                  type: string
                  format: date-time
    ReportStatus:
      type: string
      description: |
        Lifecycle of an async report:
          `queued`    — POST /check accepted; consumer worker has not picked it up yet.
          `analyzing` — consumer started; partial fields may exist.
          `complete`  — analysis written; full result available via GET /api/reports/{reportId}.
          `failed`    — terminal error; `errorMessage` populated.
      enum:
        - queued
        - analyzing
        - complete
        - failed
    RiskEvidence:
      type: object
      required:
        - kind
        - observedAt
      description: |
        One structured observation supporting a `RiskReason`. Shape is
        a flat tagged-union: every row has `kind` + `observedAt` plus
        kind-specific optional fields. Clients dispatch on `kind` and
        read only the fields documented for that kind.

        **`observedAt` is the scorer-run timestamp** — the moment the
        analysis was performed by the engine that produced THIS
        response. It is **NOT** the original source publication
        timestamp (e.g. when OFAC added an address to its list, or
        when chainabuse received a report). True source-add timestamps
        are not tracked in this version.

        Evidence rows are derived from observations already collected
        for the response (the floor's `supportingFlags` subset, the
        OSINT result block, the internal address label catalog). No
        new fetches are performed to build this list.

        Phase 1 emits at most the first three of the four locked
        kinds. `counterparty_interaction` is reserved in the schema
        but not emitted in Phase 1.
      properties:
        kind:
          type: string
          enum:
            - osint_match
            - internal_label
            - pattern_predicate
            - counterparty_interaction
          description: |
            Locked enum. Additions are a public-contract change and
            require explicit review.

            * `osint_match` — the address is on a public OSINT list
              (sanctions, scam DBs, phishing DBs, chainabuse community
              reports). Fields: `source`, `matchedList`, `label`,
              `detail?`, and for chainabuse rows the optional pair
              `chainabuseCategories` + `chainabuseReportCount`.

            * `internal_label` — the address has a hit in the
              internal address-label catalog. Fields: `source`
              (always `internal`), `label`.

            * `pattern_predicate` — an analysis predicate fired on
              the observed activity (e.g. `transit_wallet`,
              `perm_hijack_detected`). Fields: `predicate` (stable
              slug), `label` (human-readable), `flagText`
              (the raw `flags` entry that triggered it; may be null
              for synthesized meta-predicates like
              `high_flag_density`), `detail?`.

            * `counterparty_interaction` — RESERVED for Phase 2. Will
              carry `address`, `label`, `interactionCount`,
              `lastInteractionAt`, `valueUsd`. Phase 1 never emits
              this kind.
        observedAt:
          type: string
          format: date-time
          description: |
            Scorer-run timestamp (ISO-8601 with timezone offset).
            Shared across every evidence row in a single response.
            NOT a source publication or label-added timestamp.
        source:
          type: string
          description: |
            Origin of the evidence. For `osint_match`: the OSINT
            source identifier (e.g. `chainabuse`, `ofac`, `osint`).
            For `internal_label`: always `internal`. Omitted on
            `pattern_predicate`.
        matchedList:
          type: string
          description: |
            For `osint_match` rows: the specific list within the
            source (e.g. `chainabuse_reports`, `scam_list`,
            `phishing_list`). Omitted on other kinds.
        label:
          type: string
          description: |
            Human-readable label for the evidence:
            * `osint_match` — the label string from the OSINT source
              (e.g. the scam label, or a fallback like "Known
              phishing address" when the source did not provide one).
            * `internal_label` — the internal catalog entry text.
            * `pattern_predicate` — short human-readable label for
              the predicate (e.g. "Transit wallet pattern").
            * `counterparty_interaction` — the counterparty's label
              (Phase 2).
        detail:
          type:
            - string
            - "null"
          description: |
            Optional free-form detail string for any kind. Currently
            used by `pattern_predicate` for the `high_flag_density`
            meta-predicate (e.g. `"12 flags fired"`). Null when not
            applicable.
        chainabuseCategories:
          type: array
          items:
            type: string
          description: |
            For chainabuse `osint_match` rows: the categories
            (e.g. `["scam", "phishing"]`) reported by the community.
            Omitted on other rows.
        chainabuseReportCount:
          type: integer
          minimum: 0
          description: |
            For chainabuse `osint_match` rows: the total reported
            count. Omitted on other rows.
        predicate:
          type: string
          description: |
            For `pattern_predicate` rows: the stable predicate slug
            (e.g. `transit_wallet`, `perm_hijack_detected`,
            `sanctioned_self_label`, `high_flag_density`). Unknown
            future flag patterns may surface as `unknown_predicate`
            so the invariant "floor with supportingFlags > 0 ⇒
            evidence > 0" holds without a Modal redeploy. Omitted on
            other kinds.
        flagText:
          type:
            - string
            - "null"
          description: |
            For `pattern_predicate` rows: the raw `flags` entry that
            triggered the predicate. Null for synthesized meta-
            predicates (e.g. `high_flag_density`). Omitted on other
            kinds.
        address:
          type: string
          description: |
            RESERVED for `counterparty_interaction` (Phase 2). The
            counterparty address.
        interactionCount:
          type: integer
          minimum: 1
          description: |
            RESERVED for `counterparty_interaction` (Phase 2).
        lastInteractionAt:
          type:
            - string
            - "null"
          format: date-time
          description: |
            RESERVED for `counterparty_interaction` (Phase 2).
        valueUsd:
          type:
            - number
            - "null"
          description: |
            RESERVED for `counterparty_interaction` (Phase 2).
    RiskReason:
      type: object
      required:
        - code
        - kind
        - severity
        - title
        - templateKey
        - description
        - impactScore
        - supportingFlags
        - evidence
      description: |
        One ranked, typed reason contributing to the final `riskScore`.
        See the `riskReasons` field on `AnalysisResult` for ordering
        semantics. The `code` enum is locked as part of the public
        contract — additions require explicit review.
      properties:
        code:
          type: string
          description: |
            Stable machine-readable identifier. Locked enum.

            **Floor codes** (prefix `floor_`) — an override-floor that
            was applied to `riskScore` because a high-severity signal
            fired. Each floor reason carries the matching flag subset
            in `supportingFlags`.

            **Customizable floors (14)** — the floors below the
            `floor_honeypot` / `floor_excessive_tax` /
            `floor_low_token_score` group are user-customizable via
            `PATCH /api/user/risk-settings` (`overrides` field) on the
            Business plan. The 14 customizable keys are: `sanctioned`,
            `exploit`, `scam`, `phishing`, `frozen`, `mixer`,
            `perm_hijack`, `transit`, `transit_massive`, `railgun`,
            `railgun_low_anon`, `campaign`, `campaign_heavy`,
            `flag_density`. Worker / Modal / Dashboard align on this
            14-key set as of 2026-05-20 (PR #77 / PR #78).

            **Token-security floors (3, hardcoded)** —
            `floor_honeypot`, `floor_excessive_tax`,
            `floor_low_token_score` are not part of the customizable
            surface. Their floor values are fixed (80 / 70 / 60) and
            cannot be tuned via `custom_overrides`. (F-I — #52.2 docs
            hardening; revisit if user signal warrants promotion to
            customizable.)

            **Component codes** — the seven scorer components (same
            keys as `riskContributions` / `riskWeights`). Each
            component reason represents a non-zero contribution to the
            base score. Component reasons emit `supportingFlags: []`
            in this version.
          enum:
            - floor_sanctioned
            - floor_exploit
            - floor_scam
            - floor_phishing
            - floor_frozen
            - floor_mixer
            - floor_perm_hijack
            - floor_transit
            - floor_transit_massive
            - floor_railgun
            - floor_railgun_low_anon
            - floor_campaign
            - floor_campaign_heavy
            - floor_flag_density
            - floor_honeypot
            - floor_excessive_tax
            - floor_low_token_score
            - mixer_interaction
            - sanctioned_contact
            - behavioral_patterns
            - counterparty_risk
            - timing_anomalies
            - contract_risk
            - fund_flow_topology
        kind:
          type: string
          enum:
            - floor
            - component
          description: |
            `floor` — an override-floor was applied (the score is
            forced to at least `impactScore`).

            `component` — a non-zero per-component contribution to the
            base score with magnitude `impactScore`.
        severity:
          type: string
          enum:
            - critical
            - high
            - medium
            - low
          description: |
            Bucket for the reason's significance. `critical` is reserved
            for sanctioned / exploit / scam floor reasons; component
            reasons never surface as `critical`.
        title:
          type: string
          description: Short human-readable English label.
          example: Sanctioned address — score floor applied
        templateKey:
          type: string
          description: |
            Namespaced i18n key. `reason.floor.<code-suffix>` for floor
            reasons, `reason.component.<code>` for component reasons.
          example: reason.floor.sanctioned
        description:
          type: string
          description: |
            Short stable English explanation. May include dynamic
            integers (e.g. the floor minimum that was applied). Do not
            use as a translation key.
          example: Address is on a sanctions / OFAC list. The risk score is forced to at least 95.
        impactScore:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Floors: the minimum score the floor enforced (e.g. 95 for
            sanctioned). Components: `round(riskContributions[code] *
            riskWeights[code])`, i.e. the honest contribution to the
            base score before any floor. Always used as the primary
            ranking key (DESC).
        supportingFlags:
          type: array
          items:
            type: string
          description: |
            For floor reasons, the subset of `flags` (verbatim rendered
            strings) that matched the floor's predicate. For component
            reasons in this version, always an empty array.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/RiskEvidence"
          description: |
            Task #63 PR 4 — structured observations supporting this
            reason. Always an array; never null. Phase 1 populates
            evidence rows for **floor-level reasons only**; component
            reasons (`mixer_interaction`, `sanctioned_contact`,
            `behavioral_patterns`, `counterparty_risk`,
            `timing_anomalies`, `contract_risk`, `fund_flow_topology`)
            return `evidence: []` in this version — that surface is
            planned for a follow-up PR.

            New evidence `kind` values may be added in future versions
            on a strictly additive basis; clients SHOULD treat the
            `kind` enum as forward-compatible (an unknown value MUST
            NOT crash a client).

            Worker-side normalization: a pre-PR-4 Modal that omits
            this field on a reason has its reason coerced to
            `evidence: []` at the Worker boundary so the "always an
            array" contract holds regardless of which side deployed
            first.
    ScanStatus:
      type: object
      description: |
        Polling response from GET /api/v1/check/status/{reportId}. Lightweight
        summary safe to poll every ~5 seconds. Once `status === 'complete'`,
        the full report is available via GET /api/reports/{reportId}.
      required:
        - reportId
        - status
      properties:
        reportId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ReportStatus"
        phase:
          type:
            - string
            - "null"
          description: |
            Free-form phase label set by the consumer worker while
            `status='analyzing'` (e.g. `fetching_transactions`). Cleared
            (`null`) on completion. Treat as observability hint, not API.
        errorMessage:
          type:
            - string
            - "null"
          description: Populated when `status='failed'`.
        riskScore:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 100
          description: Set when `status='complete'`. `null` otherwise.
        riskLevel:
          type:
            - string
            - "null"
          enum:
            - critical
            - high
            - medium
            - low
            - null
        queuedAt:
          type:
            - string
            - "null"
          format: date-time
        startedAt:
          type:
            - string
            - "null"
          format: date-time
        finishedAt:
          type:
            - string
            - "null"
          format: date-time
    ScanStatusResponse:
      type: object
      description: |
        The REAL HTTP body of GET /api/v1/check/status/{reportId}.

        The HTTP 200 response for this endpoint uses the standard `{ success, data }` envelope —
        the handler returns `success(scanStatusFrom(...))`, and `utils/response.js::success()`
        serializes exactly this shape. The 200 used to declare bare `ScanStatus`, which described
        the INNER payload rather than the body on the wire, and the published examples (which did
        carry the envelope) contradicted it. A generated client built against the old schema
        would have looked for `status` at the top level and found `success` there instead.
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: "#/components/schemas/ScanStatus"
    TelegramLinkResponse:
      type: object
      description: |
        A single-use deep link that binds the Telegram account which opens it to this account.
        The `token` expires after 10 minutes. Treat both values as secrets: anyone who opens
        the link binds THEIR Telegram account to YOUR OnChainRisk account.

        Answers `503 TELEGRAM_BOT_USERNAME_REQUIRED` when the environment has no bot
        configured.
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          required:
            - link
            - token
          properties:
            link:
              type: string
              format: uri
            token:
              type: string
    TokenReportListItem:
