                        type: integer
                        description: Reported total transaction count for the address (best-effort, may be 0 if unknown). Present only when `partial = true`.
        "503":
          description: |
            `EXPAND_UNAVAILABLE` — the expansion could not be reliably
            completed (provider timeout / rate-limit / degraded upstream, or a
            partial with zero usable data). Retryable: the node is not marked
            expanded and the result is not cached.
