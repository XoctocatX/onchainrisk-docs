  # <<< END GENERATED:m6-unavailable-paths >>>

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: ocr_test_* (legacy keys may still use ocr_live_*)

  responses:
    Unauthorized:
      description: |
        Missing or invalid API key. Both tiers answer with the same envelope:
        `requireAuth` returns `unauthorized(...)`, which is
        `utils/response.js::error(message, 401, 'UNAUTHORIZED')`, so `error` is
        an OBJECT carrying `code` + `message` — never a bare string.
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              error: { $ref: '#/components/schemas/GenericError' }
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Authentication required

    BadRequest:
      description: Invalid request (e.g. address too large for sandbox)
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              error: { type: string, example: "address_too_large_for_sandbox" }
              estimated_tx: { type: integer }
              upgrade_url: { type: string }

    SandboxNotSupported:
      description: |
        Endpoint not available for sandbox keys. The body is actionable and
        machine-readable. `error.code` stays `sandbox_not_supported` for
        backward compatibility; `error.reason` carries the finer distinction:
        `paid_only` when the endpoint exists but is a paid feature, or
        `unsupported` when the path is not part of the sandbox API at all
        (e.g. a guessed/nonexistent endpoint shape). No risk or report data is
        returned. Sandbox reports are never saved (`_sandbox.reports_saved`
        is always `false`); persistent reports and retrieval are a paid plan
        feature.
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              error:
                type: object
                properties:
                  code:
                    type: string
                    enum: [sandbox_not_supported]
                    description: Preserved for backward compatibility.
                  reason:
                    type: string
                    enum: [paid_only, unsupported]
                  upgrade_required: { type: boolean }
                  message: { type: string }
                  endpoint:
                    type: string
                    description: "The blocked request, e.g. 'POST /api/v1/check/deep'."
                  docs_url: { type: string }
                  upgrade_url: { type: string }
                  hint: { type: string }
                required: [code, reason, upgrade_required, message, endpoint]
              _sandbox:
                type: object
                properties:
                  allowed_endpoint: { type: string, example: "POST /api/v1/check" }
                  reports_saved: { type: boolean, example: false }
          examples:
            paid-only:
              summary: A real, paid-only endpoint (reason=paid_only)
              value:
                success: false
                error:
                  code: "sandbox_not_supported"
                  reason: "paid_only"
                  upgrade_required: true
                  message: "This endpoint is available on paid API plans."
                  endpoint: "POST /api/v1/check/deep"
                  docs_url: "https://api.onchainrisk.io/sandbox-docs"
                  upgrade_url: "https://onchainrisk.io/pricing"
                  hint: "Sandbox keys can call POST /api/v1/check with { address, network }."
                _sandbox:
                  allowed_endpoint: "POST /api/v1/check"
                  reports_saved: false
            unsupported:
              summary: Path not part of the sandbox API — guessed/nonexistent (reason=unsupported)
              value:
                success: false
                error:
                  code: "sandbox_not_supported"
                  reason: "unsupported"
                  upgrade_required: false
                  message: "This endpoint is not part of the sandbox API."
                  endpoint: "GET /api/v1/address/0xabc"
                  docs_url: "https://api.onchainrisk.io/sandbox-docs"
                  upgrade_url: "https://onchainrisk.io/pricing"
                  hint: "Sandbox keys can call POST /api/v1/check with { address, network }."
                _sandbox:
                  allowed_endpoint: "POST /api/v1/check"
                  reports_saved: false

    ValidationFailed:
      description: |
        Address failed validation before any scan was performed. HTTP status
        is **422** with envelope `{ success: false, error: ErrorResponse }`.
        `error.details.errorCode` carries the granular reason.
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              error: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            address-network-mismatch:
              summary: Tron address submitted with network=eth
              value:
                success: false
                error:
                  message: "Validation failed"
                  code: "VALIDATION_ERROR"
                  details:
                    address: "Address format does not match selected network. The address looks like a tron address, but network was set to eth."
                    errorCode: "ADDRESS_NETWORK_MISMATCH"
                    detectedFamily: "tron"
                    requestedNetwork: "eth"
            invalid-address:
              summary: Whitespace-only address
              value:
                success: false
                error:
                  message: "Validation failed"
                  code: "VALIDATION_ERROR"
                  details:
                    address: "Address is required."
                    errorCode: "INVALID_ADDRESS"

    RateLimited:
      description: |
        Rate limit exceeded. TWO shapes share this status, and a client must handle
        both because the SAME generated model is used against either tier:

          * **sandbox token bucket** (`middleware/token-bucket.js`) — the short form,
            `error` is the string `"rate_limit_exceeded"`, plus `bucket`,
            `retry_after_seconds` and `upgrade_url`. Only a sandbox credential can
            receive this.
          * **paid quota / rate rejection** — the standard envelope, `error` is an
            OBJECT with `code` + `message` (`utils/response.js::error` /
            `rateLimited`). A sandbox credential never receives this, but it is
            declared here so a client generated from the sandbox contract models the
            paid response it will meet after the credential swap.

        `error` is therefore declared as `[object, string]`. `bucket`,
        `retry_after_seconds` and `upgrade_url` accompany the string form only.
      headers:
        Retry-After:
          schema: { type: integer }
          description: |
            Seconds until at least 1 token refills. Sent by the sandbox token bucket;
            the paid tier sends `X-RateLimit-*` headers instead.
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              error:
                type: [object, string]
                description: |
                  String (`"rate_limit_exceeded"`) on the sandbox token-bucket branch;
                  the `GenericError` object on the paid quota/rate branch.
                required: [code, message]
                properties:
                  code: { type: string, example: RATE_LIMITED }
                  message: { type: string, example: Rate limit exceeded }
                  details: { type: object }
              bucket:
                type: string
                enum: [per_key, per_ip]
              retry_after_seconds: { type: integer }
              upgrade_url: { type: string }

  schemas:
    GenericError:
      type: object
      description: |
        The runtime's UNIVERSAL error object — what `utils/response.js::error()`
        serializes for every non-validation failure (401, 403, 404, 429, 500, 503 …):

        ```json
        { "success": false, "error": { "code": "UNAUTHORIZED", "message": "Authentication required" } }
        ```

        Deliberately has NO `code` enum: the codes are an open, growing set and
        pinning them here would publish a closed list the runtime does not honour.
        `ErrorResponse` is the narrower validation-family view of the same object
        (its `code` enum is `VALIDATION_ERROR` only) and is kept separate so the 422
        contract stays as tight as it is today.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code, e.g. `UNAUTHORIZED`, `RATE_LIMITED`, `NO_CREDITS`.
        message:
          type: string
          description: Short human-readable summary. Never carries provider or internal detail.
        details:
          type: object
          description: Optional structured context. Absent unless the failing path supplies it.

    ErrorResponse:
      type: object
      description: |
        Stable error envelope for validation and business-rule failures.
        The shape mirrors the live API response:

        ```json
        { "success": false, "error": ErrorResponse }
        ```

        Required fields (`code` + `message`) are always populated; `details`
        carries structured diagnostic context and is present on validation
        failures. Clients should treat unknown fields as additive
        (no `additionalProperties: false`).
      required: [code, message]
      properties:
        code:
          type: string
          description: Outer envelope code. Always `VALIDATION_ERROR` for the validation family.
          enum:
            - VALIDATION_ERROR
        message:
          type: string
          description: Short, stable human-readable summary.
        details:
          type: object
          description: |
            Granular context. For validation failures the shape below is stable;
            for other error classes the API may return different keys.
          properties:
            address:
              type: string
              description: Human-readable reason specific to the failing address.
            errorCode:
              type: string
              description: |
                Granular validation reason. Stable machine-readable code.

                  - `INVALID_ADDRESS` — empty, wrong format, whitespace-only.
                  - `UNSUPPORTED_NETWORK` — `network` not in the supported list.
                  - `COULD_NOT_DETECT_NETWORK` — address format unrecognised and `network` omitted.
                  - `INVALID_ADDRESS_CHECKSUM` — decode succeeded, family checksum failed (Tron / BTC-legacy / LTC-legacy). Solana decode failures surface as `INVALID_ADDRESS` because Solana is not checksum-based.
                  - `ADDRESS_NETWORK_MISMATCH` — detected family inconsistent with requested `network`.
              enum:
                - INVALID_ADDRESS
                - UNSUPPORTED_NETWORK
                - COULD_NOT_DETECT_NETWORK
                - INVALID_ADDRESS_CHECKSUM
                - ADDRESS_NETWORK_MISMATCH
            detectedFamily:
              type: [string, 'null']
              description: |
                Address family detected from the input. Null when the format
                was unrecognisable. ENS names are resolved through a legacy
                path and are intentionally not part of the strict family
                contract documented here.
            requestedNetwork:
              type: [string, 'null']
              description: Normalized network string from the request, if any.

    # <<< GENERATED:check-schemas — do not edit by hand; see scripts/generate-sandbox-contract.mjs >>>
