          description: |-
            Async path — a DOCUMENTED FIXTURE INPUT is accepted as a simulated lifecycle instead of being analysed synchronously. The body is the paid AsyncQueuedResponse, unchanged.

            SANDBOX EXECUTION. The sandbox serves a DETERMINISTIC SIMULATED lifecycle: no queue, no
            consumer worker, no provider call, and no billing of any kind. State is a pure function of
            the acceptance instant, so it advances on the clock alone — queued until
            T+2s, analyzing until T+6s, then
            the terminal status the input's fixture declares. A lifecycle stays readable for
            3600s and then answers 404 exactly like an unknown id.

            DOCUMENTED FIXTURE INPUTS for POST /api/v1/check (network eth) — the only inputs that take
            the async path on a sandbox key. There is no request flag:
              - 0x0000000000000000000000000000000000735a01  ->  check-eth-735-async-success-v1  ->  reaches complete
              - 0x0000000000000000000000000000000000735f01  ->  check-eth-735-async-failed-v1  ->  reaches failed

            Any other address runs the ordinary bounded-real SYNCHRONOUS path and returns 200.
            Ownership is the OWNING ACCOUNT: any sandbox key on that account may poll and retrieve, and a
            repeat POST within 1800s deduplicates while the lifecycle is
            still in flight.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncQueuedResponse"
              examples:
                freshAcceptance:
                  summary: Fresh acceptance — queued, and no deduplicated key at all
                  value:
                    success: true
                    data:
                      reportId: 0f8c5b5e-1a2b-4c3d-8e9f-0a1b2c3d4e5f
                      status: queued
                      async: true
                deduplicatedAnalyzing:
                  summary: Repeat POST while the lifecycle is analyzing — same id, its CURRENT status
                  value:
                    success: true
                    data:
                      reportId: 0f8c5b5e-1a2b-4c3d-8e9f-0a1b2c3d4e5f
                      status: analyzing
                      async: true
                      deduplicated: true
      # <<< END GENERATED:check-operation >>>
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/SandboxNotSupported'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          # Reachable on the sandbox surface exactly as on paid: the bounded-real path answers
          # 503 ANALYSIS_UNAVAILABLE when the analysis backend is unusable, and the async
          # acceptance path answers 503 ACCEPTANCE_UNAVAILABLE. Declared DESCRIPTION-ONLY to
          # match the paid declaration of the same status — paid documents no body here, and
          # typing one only on the sandbox side would make a sandbox-generated client model a
          # payload branch for a response paid may send bodiless.
          description: Analysis temporarily unavailable

  /api/v1/sandbox/graph/expand:
    post:
      operationId: sandboxGraphExpand
      tags: [Graph]
      summary: Sandbox graph preview (depth=1, last 7 days, capped)
      description: |
        Sandbox graph preview is for **integration testing**. It is limited
        to depth 1, recent activity, and capped nodes/edges. Upgrade for
        full historical graph expansion via paid `/api/graph/expand`.

        Returns a node/edge graph in the same broad shape as paid
        `/api/graph/expand` (aggregated counterparty edges with
        `from`/`to`/`value`/`valueWei`/`txCount`/`firstTx`/`lastTx`/
        `tokenBreakdown`) so a sandbox client can be re-pointed at paid
        without rewriting response handling.

        ### Sandbox limits
        - `depth`: max 1 (silently clamped; reported in `_sandbox.truncated_fields.depth`)
        - `nodes`: max 20
        - `edges`: max 30
        - History window: last 7 days only
        - Tx fetch cap: 100 per request
        - No clusters, no entity expansion, no cross-chain graph, no AI
        - **No report persistence**, **no usage row**, **no credit charge**

        ### Supported networks
        EVM family — `eth`, `arbitrum`, `optimism`, `base`, `polygon`,
        `avalanche`, `zksync`, `scroll`, `celo`, `cronos`, `moonbeam`,
        plus `bsc` and `tron`. **13 networks total** in current
        production. Other networks (sol, btc, ltc, ton, cosmos, cardano,
        xrp, plus `linea`, `fantom`, `polygon_zkevm`) return **422**
        with `details.errorCode = "NETWORK_NOT_SUPPORTED_IN_SANDBOX"` —
        no silent fallback to a paid traversal.

        > `linea`, `fantom`, `polygon_zkevm` were removed from the
        > supported set in audit #46 (2026-05-04) because the upstream
        > analyzer returns 503 for these chains. They will return when
        > the underlying provider config is fixed.

        ### Auth
        API key only (sandbox `ocr_test_*` or paid `ocr_live_*`). JWT/session
        auth is rejected with 401 `API_KEY_REQUIRED`. Paid keys are allowed
        so that paid customers can integrate-test against the sandbox shape;
        the response is always sandbox-scoped regardless of key type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, network]
              properties:
                address:
                  type: string
                  example: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
                network:
                  type: string
                  enum:
                    - eth
                    - arbitrum
                    - optimism
                    - base
                    - polygon
                    - avalanche
                    - zksync
                    - scroll
                    - celo
                    - cronos
                    - moonbeam
                    - bsc
                    - tron
                  example: "eth"
                depth:
                  type: integer
                  minimum: 1
                  maximum: 1
                  default: 1
                  description: |
                    Depth is silently clamped to 1. Higher values are
                    reported back via `_sandbox.truncated_fields.depth`.
      responses:
        '200':
          description: Sandbox graph preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxGraphResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Sandbox graph preview temporarily unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  error: { type: string, example: "Sandbox graph preview temporarily unavailable. Please try again later." }
                  code: { type: string, example: "SANDBOX_GRAPH_UNAVAILABLE" }

  # Note: /api/analyze/estimate is NOT exposed on api.onchainrisk.io. It is an
  # internal preflight; direct external calls would 404. Intentionally
  # omitted from this spec.

  /api/v1/usage:
    get:
      tags: [Account]
      summary: Current quota and rate limit for this key
      description: |
        Quota introspection for the authenticated key. This is the supported public
        surface for checking how much of your allowance is left before you schedule
        work — sandbox keys are accepted here (`key_type: "sandbox"`) even though they
        cannot call the paid compute endpoints.

        `plan_quota` is the recurring plan allowance; the free tier it uses is a
        rolling 24-hour window, so `billing_period.start` and `.end` are `null`.
        `purchased_credits.available` is a separate balance. The same endpoint is in
        the paid contract and returns the same shape.
      responses:
        '200':
          description: Current quota state
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [plan, key_type, billing_period, plan_quota, purchased_credits, rate_limit]
                    properties:
                      plan: { type: string, example: free }
                      key_type:
                        type: [string, 'null']
                        enum: [paid, sandbox, null]
                        description: '`sandbox` for a sandbox key. `null` only for session auth.'
                        example: sandbox
                      billing_period:
                        type: object
                        required: [type, start, end]
                        properties:
                          type: { type: string, enum: [monthly, rolling_24h, none], example: rolling_24h }
                          start: { type: [string, 'null'], format: date-time }
                          end: { type: [string, 'null'], format: date-time }
                      plan_quota:
                        type: object
                        required: [used, limit, remaining]
                        properties:
                          used: { type: integer, example: 3 }
                          limit: { type: [integer, 'null'], example: 10 }
                          remaining: { type: [integer, 'null'], example: 7 }
                      purchased_credits:
                        type: object
                        required: [available]
                        properties:
                          available: { type: integer, example: 0 }
                      rate_limit:
                        type: object
                        required: [requests_per_second]
                        properties:
                          requests_per_second: { type: integer, example: 1 }
        '401':
          $ref: '#/components/responses/Unauthorized'

  # <<< GENERATED:async-paths — do not edit by hand; see scripts/generate-sandbox-contract.mjs >>>
  /api/v1/check/status/{reportId}:
    get:
      tags:
        - Analysis
      summary: Async scan status (polling)
      description: |-
        Poll the status of an async scan that POST `/api/v1/check` returned with
        `async: true`. Lightweight: returns lifecycle status + risk summary
        once complete — **this endpoint never returns the full report body.**
        Does NOT consume quota.

        Ownership is the **owning account**, not a particular key: the report
        may be polled by any authenticated API key belonging to the account
        that owns it, including one created after the scan was accepted.

        When `status` is `complete`, retrieve the full analysis with
        `GET /api/reports/{reportId}`.

        **Lifecycle:**
          `queued` → `analyzing` → `complete` | `failed`

        Poll every 5 seconds until status is `complete` or `failed`. Typical
        end-to-end completion is 1–5 minutes for heavy addresses.

        SANDBOX EXECUTION. The sandbox serves a DETERMINISTIC SIMULATED lifecycle: no queue, no
        consumer worker, no provider call, and no billing of any kind. State is a pure function of
        the acceptance instant, so it advances on the clock alone — queued until
        T+2s, analyzing until T+6s, then
        the terminal status the input's fixture declares. A lifecycle stays readable for
