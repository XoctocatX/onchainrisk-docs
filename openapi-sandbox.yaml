        riskReasons:
          type: array
          description: |-
            Ranked, typed reasons explaining the `riskScore`. Each entry
            is either a `floor` (an override floor that was applied) or
            a `component` (a non-zero per-component contribution to the
            base score).

            Sort order is deterministic and stable across runs:
              1. `impactScore` descending,
              2. `kind` ascending (`floor` before `component`),
              3. `code` ascending alphabetical.

            Empty array when `riskScore` is `null` (insufficient data)
            or when no signal exceeded the minimum-impact threshold.
            Older servers may omit the field entirely — clients should
            default to `[]` if absent.

            Floor reasons carry the matching flag subset in
            `supportingFlags`. Component reasons emit `supportingFlags: []`
            in this PR; per-component flag attribution is planned for a
            later PR.

